<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>SGC – Sistema de Gerenciamento de Contratos</title>
<style>
  :root{
    --bg:#f4f6f5; --card:#fff; --ink:#1d2a24; --muted:#6b7a72; --line:#dfe5e1;
    --pri:#1f6f4a; --pri2:#e6f2ec; --warn:#b4541b; --warn2:#fdf0e7; --danger:#b42318; --danger2:#fdecea;
  }
  *{box-sizing:border-box}
  [hidden]{display:none!important}
  body{margin:0;font-family:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;background:var(--bg);color:var(--ink);font-size:15px}
  header{background:var(--pri);color:#fff;padding:12px 20px;display:flex;align-items:center;justify-content:space-between;flex-wrap:wrap;gap:10px}
  header h1{font-size:18px;margin:0;font-weight:600;cursor:pointer}
  header h1 small{font-weight:400;opacity:.8;font-size:13px;margin-left:6px}
  header .acoes{display:flex;gap:6px;align-items:center;flex-wrap:wrap}
  header .acoes button{background:rgba(255,255,255,.15);color:#fff;border:1px solid rgba(255,255,255,.35)}
  .usuario{font-size:13px;opacity:.9;margin-right:6px}
  .barra-contrato{background:#fff;border-bottom:1px solid var(--line);padding:12px 20px;display:flex;gap:14px;align-items:center;flex-wrap:wrap}
  .barra-contrato .nome{font-weight:600;font-size:16px}
  .barra-contrato .sub{color:var(--muted);font-size:13px}
  .barra-contrato .mes{margin-left:auto;display:flex;gap:10px;align-items:center;font-size:13px;color:var(--muted)}
  nav.mods{display:flex;gap:4px;padding:0 16px;background:#fff;border-bottom:1px solid var(--line);overflow-x:auto}
  nav.mods button{background:none;border:none;border-bottom:3px solid transparent;border-radius:0;padding:13px 14px;color:var(--muted);font-weight:500;white-space:nowrap}
  nav.mods button.ativo{color:var(--pri);border-bottom-color:var(--pri)}
  nav.abas{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:16px}
  nav.abas button{border-radius:20px;padding:6px 14px;font-size:14px}
  nav.abas button.ativo{background:var(--pri);color:#fff;border-color:var(--pri)}
  main{max-width:1250px;margin:0 auto;padding:20px 16px 60px}
  h2{font-size:17px;margin:0 0 14px}
  h3{font-size:15px;margin:22px 0 10px;color:var(--muted);font-weight:600}
  .card{background:var(--card);border:1px solid var(--line);border-radius:10px;padding:18px;margin-bottom:18px}
  .grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(190px,1fr));gap:12px}
  .grid2{display:grid;grid-template-columns:repeat(auto-fit,minmax(360px,1fr));gap:18px}
  label{display:flex;flex-direction:column;font-size:13px;color:var(--muted);gap:4px}
  label.largo{margin-top:12px}
  input,select,textarea{font:inherit;padding:8px 10px;border:1px solid var(--line);border-radius:6px;background:#fff;color:var(--ink)}
  input:focus,select:focus,textarea:focus{outline:2px solid var(--pri2);border-color:var(--pri)}
  button{font:inherit;cursor:pointer;padding:8px 14px;border-radius:6px;border:1px solid var(--line);background:#fff;color:var(--ink)}
  button.pri{background:var(--pri);color:#fff;border-color:var(--pri)}
  button.peq{padding:4px 9px;font-size:13px}
  button.del{color:var(--danger)}
  .linha-botoes{display:flex;gap:8px;margin-top:14px;flex-wrap:wrap}
  .tabela-wrap{overflow-x:auto}
  table{width:100%;border-collapse:collapse;font-size:14px}
  th,td{padding:8px 10px;border-bottom:1px solid var(--line);text-align:left;white-space:nowrap}
  th{color:var(--muted);font-weight:500;font-size:12px;text-transform:uppercase;letter-spacing:.03em;background:#fafbfa}
  td.num,th.num{text-align:right;font-variant-numeric:tabular-nums}
  tr.total td{font-weight:600;background:#fafbfa}
  .vazio{color:var(--muted);text-align:center;padding:24px}
  .kpis{display:grid;grid-template-columns:repeat(auto-fit,minmax(170px,1fr));gap:12px;margin-bottom:18px}
  .kpi{background:#fff;border:1px solid var(--line);border-radius:10px;padding:14px 16px}
  .kpi .v{font-size:23px;font-weight:600;margin-top:4px;font-variant-numeric:tabular-nums}
  .kpi .r{font-size:12px;color:var(--muted)}
  .filtros{display:flex;gap:10px;align-items:center;flex-wrap:wrap;margin-bottom:14px}
  .barra{height:8px;background:var(--pri2);border-radius:4px;overflow:hidden;min-width:80px}
  .barra i{display:block;height:100%;background:var(--pri)}
  .tag{display:inline-block;padding:2px 8px;border-radius:10px;font-size:12px;background:var(--pri2);color:var(--pri)}
  .tag.w{background:var(--warn2);color:var(--warn)}
  .tag.d{background:var(--danger2);color:var(--danger)}
  .tag.n{background:#eef0ef;color:var(--muted)}
  .checks{display:flex;flex-wrap:wrap;gap:6px 14px;padding:8px;border:1px solid var(--line);border-radius:6px;max-height:150px;overflow:auto}
  .checks label{flex-direction:row;align-items:center;gap:6px;color:var(--ink);font-size:14px}
  .info{font-size:13px;color:var(--muted);margin-top:8px}
  .contratos{display:grid;grid-template-columns:repeat(auto-fill,minmax(280px,1fr));gap:14px}
  .contrato{background:#fff;border:1px solid var(--line);border-radius:10px;padding:16px;display:flex;flex-direction:column;gap:8px}
  .contrato .t{font-weight:600;font-size:16px}
  .contrato .s{color:var(--muted);font-size:13px}
  .contrato .mods{display:flex;flex-wrap:wrap;gap:4px}
  .contrato .linha-botoes{margin-top:auto;padding-top:6px}
  details.card summary{cursor:pointer;font-weight:600}
  details.card[open] summary{margin-bottom:14px}
  .toast{position:fixed;bottom:20px;left:50%;transform:translateX(-50%);background:var(--ink);color:#fff;padding:10px 18px;border-radius:8px;opacity:0;transition:.25s;pointer-events:none;z-index:70}
  .toast.on{opacity:1}
  #telaLogin{position:fixed;inset:0;background:var(--bg);display:flex;align-items:center;justify-content:center;z-index:50;padding:16px}
  #telaLogin .card{width:100%;max-width:380px}
  #telaLogin form{display:flex;flex-direction:column;gap:12px}
  #telaLogin .erro{color:var(--danger);font-size:13px;min-height:18px}
  #telaLogin a{color:var(--pri);font-size:13px;cursor:pointer}
  .carregando{position:fixed;top:0;left:0;right:0;height:3px;background:linear-gradient(90deg,transparent,var(--pri),transparent);background-size:200% 100%;animation:car 1s linear infinite;z-index:60;display:none}
  .carregando.on{display:block}
  @keyframes car{from{background-position:100% 0}to{background-position:-100% 0}}
  @media print{header .acoes,nav,form,.linha-botoes,button,details{display:none!important}}
</style>
</head>
<body>
<div class="carregando" id="carregando"></div>

<div id="telaLogin">
  <div class="card">
    <h2 id="loginTitulo">SGC – Gerenciamento de Contratos</h2>
    <form id="fLogin">
      <label>E-mail <input type="email" name="email" required autocomplete="username"></label>
      <label>Senha <input type="password" name="senha" autocomplete="current-password"></label>
      <div class="erro" id="loginErro"></div>
      <button class="pri" type="submit" id="loginBotao">Entrar</button>
      <a id="linkEsqueci">Esqueci minha senha</a>
    </form>
    <form id="fNovaSenha" hidden>
      <p class="info" style="margin:0">Crie sua senha de acesso (mínimo 6 caracteres).</p>
      <label>Nova senha <input type="password" name="senha" minlength="6" required autocomplete="new-password"></label>
      <label>Repita a senha <input type="password" name="senha2" minlength="6" required autocomplete="new-password"></label>
      <div class="erro" id="novaSenhaErro"></div>
      <button class="pri" type="submit">Salvar senha e entrar</button>
    </form>
  </div>
</div>

<header>
  <h1 id="logo">SGC <small>Sistema de Gerenciamento de Contratos</small></h1>
  <div class="acoes">
    <span class="usuario" id="usuarioEmail"></span>
    <button id="btnContratos" hidden>← Contratos</button>
    <button id="btnAtualizar">Atualizar</button>
    <button id="btnBackup" hidden>Salvar backup</button>
    <button id="btnSair">Sair</button>
  </div>
</header>

<div id="barraContrato" class="barra-contrato" hidden></div>
<nav class="mods" id="navMods" hidden></nav>
<main id="conteudo"></main>
<div class="toast" id="toast"></div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script>
/* ===================== SUPABASE ===================== */
const SUPABASE_URL = 'https://xmxcdrtrdvxjkzfxbxsl.supabase.co';
const SUPABASE_KEY = 'sb_publishable_n_SJIeAlMHqsSbU01hA-Rg_djL-Utos';
// Links de convite ou de "esqueci a senha" chegam com type=invite/recovery: nesses casos pedimos para criar a senha.
let PRECISA_SENHA = /type=(invite|recovery)/.test(location.hash);
const sb = supabase.createClient(SUPABASE_URL, SUPABASE_KEY);
const TABELA = 'registros';

/* ===================== UTILIDADES ===================== */
const $ = s => document.querySelector(s);
const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const num = (v,d=2) => Number(v||0).toLocaleString('pt-BR',{minimumFractionDigits:d,maximumFractionDigits:d});
const brl = v => Number(v||0).toLocaleString('pt-BR',{style:'currency',currency:'BRL'});
const dataBR = d => d ? String(d).slice(0,10).split('-').reverse().join('/') : '';
const dtBR = d => d ? new Date(d).toLocaleString('pt-BR',{dateStyle:'short',timeStyle:'short'}) : '';
const hoje = () => { const d=new Date(); d.setMinutes(d.getMinutes()-d.getTimezoneOffset()); return d.toISOString().slice(0,10); };
const MESES = ['janeiro','fevereiro','março','abril','maio','junho','julho','agosto','setembro','outubro','novembro','dezembro'];
const mesBR = m => m ? MESES[+m.slice(5,7)-1]+' de '+m.slice(0,4) : '';
const soma = (l,f) => l.reduce((s,r)=>s+(+f(r)||0),0);
const uid = () => (crypto.randomUUID ? crypto.randomUUID() : Date.now().toString(36)+Math.random().toString(36).slice(2,9));
function horasEntre(a,b){ if(!a||!b) return 0; const h=(new Date(b)-new Date(a))/36e5; return h>0?h:0; }
function hhmm(h){ const t=Math.round(h*60); return `${Math.floor(t/60)}h${String(t%60).padStart(2,'0')}`; }
function toast(msg){ const t=$('#toast'); t.textContent=msg; t.classList.add('on'); clearTimeout(t._t); t._t=setTimeout(()=>t.classList.remove('on'),2400); }
function carregando(on){ $('#carregando').classList.toggle('on', on); }
const tag = (txt, tipo='') => `<span class="tag ${tipo}">${esc(txt)}</span>`;
const kpi = (t,v,r='') => `<div class="kpi"><div class="r">${esc(t)}</div><div class="v">${v}</div><div class="r">${r}</div></div>`;
function tabelaBarras(titulos, pares, fmt=v=>num(v)){
  const max = Math.max(1, ...pares.map(p=>p[1]));
  const linhas = pares.map(([n,v,extra])=>`<tr><td>${esc(n)}</td><td class="num">${fmt(v)}</td>${extra!==undefined?`<td class="num">${extra}</td>`:''}<td style="width:35%"><div class="barra"><i style="width:${v/max*100}%"></i></div></td></tr>`);
  return `<table><thead><tr>${titulos.map((t,i)=>`<th class="${i?'num':''}">${t}</th>`).join('')}<th></th></tr></thead><tbody>${linhas.join('')||`<tr><td class="vazio" colspan="${titulos.length+1}">Sem dados no período.</td></tr>`}</tbody></table>`;
}
function agrupa(lista, chave, valor){ const g={}; lista.forEach(r=>{ const k=chave(r)||'—'; g[k]=(g[k]||0)+(+valor(r)||0); }); return Object.entries(g).sort((a,b)=>b[1]-a[1]); }

/* ===================== LISTAS DE OPÇÕES ===================== */
const OPT_COMB = ['Gasolina','Mistura 2T','Diesel S10','Diesel S500','Etanol','Elétrico','Não se aplica'];
const TIPOS_EQ = ['Roçadeira Costal','Trator','Prensa','Empilhadeira','Caminhão','Veículo leve','Gerador','Outro'];
const SIT_EQ = ['Operando','Em manutenção','Parado','Inativo'];
const TIPOS_OC = ['Falta','Falta justificada','Atestado','Atraso / saída antecipada','Hora extra 50%','Hora extra 100%','Férias','Afastamento','Folga / banco de horas'];
const AUSENCIAS = ['Falta','Falta justificada','Atestado','Atraso / saída antecipada'];
const FUNCOES_PADRAO = ['Operador de máquina fixa','Ajudante geral','Operador de empilhadeira','Motorista','Auxiliar administrativo','Operador de roçadeira','Motorista de trator','Prensista','Encarregado'];
const MATERIAIS_PADRAO = ['Papelão','Plástico','Filme stretch','Big bag','Papel misto','Sucata metálica','Outro'];
const TURNOS = ['1º turno','2º turno','3º turno','Administrativo'];

/* ===================== ESTADO ===================== */
let contratos = [];
let contrato = null;       // contrato aberto
let db = {};               // registros do contrato aberto, por coleção
const est = { mod:'geral', aba:0, mes:hoje().slice(0,7) };
const L = k => db[k] || [];
const ativoColab = r => r.ativo !== 'Inativo';
const ativoEquip = r => r.situacao !== 'Inativo';
const nomeColab = id => L('colaboradores').find(c=>c.id===id)?.nome || '—';
const equip = id => L('equipamentos').find(e=>e.id===id);
const nomeEquip = id => { const e=equip(id); return e ? e.codigo+(e.modelo?' – '+e.modelo:'') : '—'; };
const funcoes = () => [...new Set([...FUNCOES_PADRAO, ...L('quadro').map(q=>q.funcao), ...L('colaboradores').map(c=>c.funcao)].filter(Boolean))];
const materiais = () => [...new Set([...MATERIAIS_PADRAO, ...L('fardos').map(f=>f.material)].filter(Boolean))];
const doMes = (lista, campo) => est.mes ? lista.filter(r=>String(r[campo]||'').slice(0,7)===est.mes) : lista;
const jornada = () => +contrato?.jornada || 8;
const diasUteis = () => +contrato?.diasUteis || 22;

/* ===================== ENTIDADES (cadastros e lançamentos) ===================== */
const col = (l, v, o={}) => ({ l, v, ...o });
const sitTag = s => tag(s||'—', s==='Operando'||s==='Ativo'||s==='Concluída' ? '' : s==='Em manutenção'||s==='Em andamento'||s==='Suspenso' ? 'w' : s==='Parado'||s==='Aberta' ? 'd' : 'n');

const MODULOS_OPCIONAIS = [['combustivel','Combustível'],['rh','RH'],['equipamentos','Controle de Equipamentos'],['fardos','Produção de Fardos']];

const ENT = {
  contratos: { nome:'contrato', titulo:r=>r.nome, campos:[
      {k:'nome',l:'Nome do contrato',req:1},{k:'cliente',l:'Cliente'},{k:'local',l:'Unidade / Local'},{k:'numero',l:'Nº do contrato'},
      {k:'inicio',l:'Início',t:'date'},{k:'fim',l:'Término',t:'date'},{k:'status',l:'Situação',t:'select',op:['Ativo','Suspenso','Encerrado']},
      {k:'diasUteis',l:'Dias úteis por mês (RH)',t:'number',step:'1',def:'22'},{k:'jornada',l:'Jornada diária em horas (RH)',t:'number',step:'0.01',def:'8'},
      {k:'modulos',l:'Módulos deste contrato',t:'multi',op:()=>MODULOS_OPCIONAIS,defTodos:1},{k:'obs',l:'Observações',t:'textarea'}] },

  colaboradores: { nome:'colaborador', titulo:r=>r.nome, ordem:(a,b)=>String(a.nome).localeCompare(b.nome), campos:[
      {k:'nome',l:'Nome',req:1},{k:'matricula',l:'Matrícula'},{k:'funcao',l:'Função',t:'list',op:funcoes},{k:'admissao',l:'Admissão',t:'date',semDef:1},
      {k:'telefone',l:'Telefone'},{k:'ativo',l:'Situação',t:'select',op:['Ativo','Inativo']}],
    cols:[col('Nome',r=>r.nome),col('Matrícula',r=>r.matricula),col('Função',r=>r.funcao),col('Admissão',r=>dataBR(r.admissao)),col('Telefone',r=>r.telefone),col('Situação',r=>sitTag(r.ativo||'Ativo'),{html:1})] },

  equipamentos: { nome:'equipamento', titulo:r=>`${r.codigo} – ${r.tipo}${r.modelo?' ('+r.modelo+')':''}`, ordem:(a,b)=>String(a.codigo).localeCompare(b.codigo), campos:[
      {k:'codigo',l:'Código / Patrimônio',req:1},{k:'tipo',l:'Tipo',t:'select',op:TIPOS_EQ},{k:'modelo',l:'Marca / Modelo'},{k:'placa',l:'Placa / Nº de série'},
      {k:'combustivel',l:'Combustível padrão',t:'select',op:OPT_COMB},{k:'horimetro',l:'Horímetro / Km atual',t:'number',step:'0.1'},{k:'situacao',l:'Situação',t:'select',op:SIT_EQ}],
    cols:[col('Código',r=>r.codigo),col('Tipo',r=>r.tipo),col('Modelo',r=>r.modelo),col('Placa / Série',r=>r.placa),col('Combustível',r=>r.combustivel),col('Horímetro',r=>r.horimetro?num(r.horimetro,1):'',{n:1}),col('Situação',r=>sitTag(r.situacao),{html:1})] },

  quadro: { nome:'função no quadro', titulo:r=>r.funcao, ordem:(a,b)=>String(a.funcao).localeCompare(b.funcao), campos:[
      {k:'funcao',l:'Função',t:'list',op:funcoes,req:1},{k:'previsto',l:'Quantidade prevista',t:'number',step:'1',req:1},{k:'obs',l:'Observação'}],
    cols:[col('Função',r=>r.funcao),col('Previsto',r=>num(r.previsto,0),{n:1,tot:l=>num(soma(l,r=>r.previsto),0)}),col('Ativos hoje',r=>num(L('colaboradores').filter(c=>ativoColab(c)&&c.funcao===r.funcao).length,0),{n:1}),col('Observação',r=>r.obs)] },

  ocorrencias: { nome:'ocorrência', data:'data', campos:[
      {k:'data',l:'Data',t:'date',req:1},{k:'colabId',l:'Colaborador',t:'ref',ent:'colaboradores',filtro:ativoColab,req:1},{k:'tipo',l:'Tipo',t:'select',op:TIPOS_OC,req:1},
      {k:'dias',l:'Dias',t:'number',step:'0.5'},{k:'horas',l:'Horas',t:'number',step:'0.01'},{k:'obs',l:'Observação',t:'textarea'}],
    validar:o=>(+o.dias||+o.horas)?'':'Informe os dias ou as horas da ocorrência.',
    cols:[col('Data',r=>dataBR(r.data)),col('Colaborador',r=>nomeColab(r.colabId)),col('Tipo',r=>tag(r.tipo, r.tipo.startsWith('Hora extra')?'w':AUSENCIAS.includes(r.tipo)?'d':'n'),{html:1}),
      col('Dias',r=>r.dias?num(r.dias,1):'',{n:1,tot:l=>num(soma(l,r=>r.dias),1)}),col('Horas',r=>r.horas?num(r.horas):'',{n:1,tot:l=>num(soma(l,r=>r.horas))}),col('Observação',r=>r.obs)] },

  abastecimentos: { nome:'abastecimento', data:'data', campos:[
      {k:'data',l:'Data',t:'date',req:1},{k:'equipId',l:'Equipamento',t:'ref',ent:'equipamentos',filtro:ativoEquip,req:1},{k:'colabId',l:'Operador / Motorista',t:'ref',ent:'colaboradores',filtro:ativoColab,req:1},
      {k:'combustivel',l:'Combustível',t:'select',op:OPT_COMB},{k:'litros',l:'Litros',t:'number',req:1},{k:'valorLitro',l:'Valor por litro (R$)',t:'number'},
      {k:'horimetro',l:'Horímetro / Km',t:'number',step:'0.1'},{k:'local',l:'Local / Frente'},{k:'obs',l:'Observação',t:'textarea'}],
    cols:[col('Data',r=>dataBR(r.data)),col('Equipamento',r=>nomeEquip(r.equipId)),col('Operador',r=>nomeColab(r.colabId)),col('Combustível',r=>r.combustivel),
      col('Litros',r=>num(r.litros),{n:1,tot:l=>num(soma(l,r=>r.litros))}),col('R$/L',r=>r.valorLitro?brl(r.valorLitro):'—',{n:1}),
      col('Total R$',r=>(+r.litros*+r.valorLitro)?brl(+r.litros*+r.valorLitro):'—',{n:1,tot:l=>brl(soma(l,r=>(+r.litros||0)*(+r.valorLitro||0)))}),
      col('Horímetro',r=>r.horimetro?num(r.horimetro,1):'—',{n:1}),col('Local',r=>r.local)] },

  nylon: { nome:'lançamento de nylon e faca', data:'data', campos:[
      {k:'data',l:'Data',t:'date',req:1},{k:'equipId',l:'Equipamento',t:'ref',ent:'equipamentos',filtro:ativoEquip,req:1},{k:'colabId',l:'Operador',t:'ref',ent:'colaboradores',filtro:ativoColab,req:1},
      {k:'nylon',l:'Nylon (quantidade)',t:'number',def:'0'},{k:'unNylon',l:'Unidade do nylon',t:'select',op:['metros','rolos','kg','unidades']},{k:'faca',l:'Faca (quantidade)',t:'number',step:'1',def:'0'},
      {k:'local',l:'Local / Frente'},{k:'obs',l:'Observação',t:'textarea'}],
    cols:[col('Data',r=>dataBR(r.data)),col('Equipamento',r=>nomeEquip(r.equipId)),col('Operador',r=>nomeColab(r.colabId)),
      col('Nylon',r=>num(r.nylon)+' '+(r.unNylon||''),{n:1,tot:l=>agrupa(l,r=>r.unNylon,r=>r.nylon).map(([u,v])=>num(v)+' '+u).join(' + ')}),
      col('Faca',r=>num(r.faca,0),{n:1,tot:l=>num(soma(l,r=>r.faca),0)}),col('Local',r=>r.local)] },

  ordens: { nome:'ordem de serviço', data:'inicio', campos:[
      {k:'numero',l:'Nº da OS',req:1},{k:'local',l:'Local / Área',req:1},{k:'tipo',l:'Tipo de serviço',t:'select',op:['Roçada costal','Roçada com trator','Capina','Limpeza','Outro']},

/* ===================== BANCO DE DADOS ===================== */
async function buscarTudo(filtro){
  const passo=1000; let de=0; const linhas=[];
  while(true){
    const { data, error } = await filtro(sb.from(TABELA).select('id,colecao,dados')).order('criado_em').range(de, de+passo-1);
    if(error) throw error;
    linhas.push(...data); if(data.length<passo) break; de+=passo;
  }
  return linhas.map(r=>Object.assign({}, r.dados, { id:r.id, _col:r.colecao }));
}
async function carregarContratos(){
  carregando(true);
  try{ contratos = (await buscarTudo(q=>q.eq('colecao','contratos'))).map(({_col,...r})=>r); }
  catch(e){ console.error(e); toast('Erro ao carregar contratos: '+(e.message||e)); }
  carregando(false);
}
async function carregarContrato(){
  carregando(true);
  try{
    const novo = {}; COLECOES_CONTRATO.forEach(c=>novo[c]=[]);
    (await buscarTudo(q=>q.eq('contrato_id', contrato.id))).forEach(({_col,...r})=>{ if(novo[_col]) novo[_col].push(r); });
    db = novo;
  }catch(e){ console.error(e); toast('Erro ao carregar dados: '+(e.message||e)); }
  carregando(false);
}
async function gravar(k, obj){
  const novo = !obj.id; if(novo) obj.id = uid();
  const { id, ...dados } = obj;
  carregando(true);
  const { error } = await sb.from(TABELA).upsert({ id, colecao:k, contrato_id: k==='contratos' ? null : contrato.id, dados, atualizado_em:new Date().toISOString() });
  carregando(false);
  if(error){ if(novo) obj.id=''; throw error; }
  const lista = k==='contratos' ? contratos : (db[k] = db[k] || []);
  const i = lista.findIndex(x=>x.id===id); if(i>-1) lista[i]=obj; else lista.push(obj);
  if(k==='contratos' && contrato?.id===id) contrato = obj;
}
async function excluir(k, id){
  if(k==='contratos'){
    const { count, error } = await sb.from(TABELA).select('id',{count:'exact',head:true}).eq('contrato_id',id);
    if(error){ alert(error.message); return; }
    if(count){ alert(`Este contrato tem ${count} registros. Para preservar o histórico, mude a situação para "Encerrado" em vez de excluir.`); return; }
  } else {
    const usos = COLECOES_CONTRATO.reduce((n,c)=>n+L(c).filter(r=>r.id!==id && Object.values(r).some(v=>v===id||(Array.isArray(v)&&v.includes(id)))).length,0);
    if(usos){ alert(`Este cadastro é usado em ${usos} lançamento(s). Marque-o como Inativo em vez de excluir.`); return; }
  }
  if(!confirm('Excluir este registro?')) return;
  carregando(true);
  const { error } = await sb.from(TABELA).delete().eq('id', id);
  carregando(false);
  if(error){ alert('Não foi possível excluir: '+error.message); return; }
  if(k==='contratos') contratos = contratos.filter(x=>x.id!==id); else db[k] = L(k).filter(x=>x.id!==id);
  toast('Excluído.'); renderTudo();
}

/* ===================== FORMULÁRIOS GENÉRICOS ===================== */
function opcoesRef(f){
  if(f.op) return f.op();
  return L(f.ent).filter(f.filtro||(()=>true)).sort(ENT[f.ent].ordem||(()=>0)).map(r=>[r.id, ENT[f.ent].titulo(r)]);
}
function campoHTML(k, f){
  const req = f.req ? ' required' : '', rot = esc(f.l)+(f.req?' *':'');
  switch(f.t){
    case 'multi': {
      const ops = opcoesRef(f);
      return `<label class="largo">${rot}<div class="checks" data-multi="${f.k}">${ops.map(([v,t])=>`<label><input type="checkbox" value="${esc(v)}"> ${esc(t)}</label>`).join('') || '<span class="info" style="margin:0">Nenhum cadastro ativo.</span>'}</div></label>`;
    }
    case 'textarea': return `<label class="largo">${rot}<textarea name="${f.k}" rows="2"></textarea></label>`;
    case 'select': return `<label>${rot}<select name="${f.k}"${req}>${f.op.map(o=>`<option>${esc(o)}</option>`).join('')}</select></label>`;
    case 'ref': {
      const ops = opcoesRef(f);
      return `<label>${rot}<select name="${f.k}"${req}><option value="">${ops.length?'Selecione…':'Nada cadastrado em Cadastros'}</option>${ops.map(([v,t])=>`<option value="${esc(v)}">${esc(t)}</option>`).join('')}</select></label>`;
    }
    case 'list': return `<label>${rot}<input name="${f.k}" list="dl_${k}_${f.k}"${req} autocomplete="off"><datalist id="dl_${k}_${f.k}">${f.op().map(o=>`<option value="${esc(o)}">`).join('')}</datalist></label>`;
    case 'number': return `<label>${rot}<input type="number" name="${f.k}" step="${f.step||'0.01'}" min="0"${req}></label>`;
    case 'date': return `<label>${rot}<input type="date" name="${f.k}"${req}></label>`;
    case 'datetime': return `<label>${rot}<input type="datetime-local" name="${f.k}"${req}></label>`;
    default: return `<label>${rot}<input type="text" name="${f.k}"${req}></label>`;
  }
}
function formHTML(k){
  const E = ENT[k], largos = f => ['multi','textarea'].includes(f.t);
  return `<form id="form_${k}" data-ent="${k}"><input type="hidden" name="id">
    <div class="grid">${E.campos.filter(f=>!largos(f)).map(f=>campoHTML(k,f)).join('')}</div>
    ${E.campos.filter(largos).map(f=>campoHTML(k,f)).join('')}
    ${E.extra?`<div class="info" id="extra_${k}"></div>`:''}
    <div class="linha-botoes"><button class="pri" type="submit">Salvar</button><button type="button" data-limpar="${k}">Limpar / novo</button></div></form>`;
}
function prepararForm(k){
  const f = $('#form_'+k); if(!f) return;
  const E = ENT[k];
  f.addEventListener('submit', async e=>{
    e.preventDefault();
    const o = Object.fromEntries(new FormData(f).entries());
    f.querySelectorAll('[data-multi]').forEach(m=>{ o[m.dataset.multi] = [...m.querySelectorAll('input:checked')].map(i=>i.value); });
    const msg = E.validar?.(o); if(msg){ alert(msg); return; }
    if(k!=='contratos' && !o.id) o.criadoPor = $('#usuarioEmail').textContent;
    try{ await gravar(k, o); }catch(err){ alert('Não foi possível salvar: '+(err.message||err)); return; }
    toast('Salvo!'); renderTudo();
  });
  if(E.extra){ const up=()=>$('#extra_'+k).textContent=E.extra(f); f.addEventListener('input',up); f.addEventListener('change',up); }
  if(k==='ordens') f.querySelector('[data-multi="colabs"]').addEventListener('change',()=>{ const n=f.querySelectorAll('[data-multi="colabs"] input:checked').length; if(n){ f.qtdColab.value=n; $('#extra_ordens').textContent=E.extra(f);} });
  if(k==='abastecimentos') f.equipId.addEventListener('change',()=>{ const e=equip(f.equipId.value); if(e?.combustivel) f.combustivel.value=e.combustivel; });
  limparForm(k);
}
function limparForm(k){
  const f = $('#form_'+k); if(!f) return; const E = ENT[k];
  f.reset(); f.elements.id.value='';
  E.campos.forEach(c=>{
    const el = f.elements[c.k];
    if(c.t==='date' && !c.semDef && el) el.value = hoje();
    if(c.def!==undefined && el) el.value = c.def;
    if(c.t==='multi') f.querySelectorAll(`[data-multi="${c.k}"] input`).forEach(i=>i.checked=!!c.defTodos);
  });
  const h = f.closest('.card')?.querySelector('h2'); if(h) h.textContent = 'Novo: '+E.nome;
  if(E.extra) $('#extra_'+k).textContent = E.extra(f);
}
function editarForm(k, id){
  const lista = k==='contratos' ? contratos : L(k), o = lista.find(x=>x.id===id); if(!o) return;
  if(k==='contratos') $('#novoContrato').open = true;
  const f = $('#form_'+k), E = ENT[k];
  limparForm(k);
  f.elements.id.value = o.id;
  E.campos.forEach(c=>{
    if(c.t==='multi'){ f.querySelectorAll(`[data-multi="${c.k}"] input`).forEach(i=>i.checked=(o[c.k]||[]).includes(i.value)); return; }
    const el = f.elements[c.k]; if(!el) return;
    const v = o[c.k] ?? '';
    if(el.tagName==='SELECT' && v && ![...el.options].some(op=>op.value===v)){ const op=document.createElement('option'); op.value=v; op.textContent=c.t==='ref'?(ENT[c.ent].titulo(L(c.ent).find(r=>r.id===v)||{codigo:v,nome:v,tipo:''})+' (inativo)'):v; el.appendChild(op); }
    el.value = v;
  });
  const h = f.closest('.card')?.querySelector('h2'); if(h) h.textContent = 'Editando: '+E.nome;
  if(E.extra) $('#extra_'+k).textContent = E.extra(f);
  f.scrollIntoView({behavior:'smooth', block:'start'});
}

function resumoCombustivel(){
  const ab = doMes(L('abastecimentos'),'data'), ny = doMes(L('nylon'),'data'), os = doMes(L('ordens'),'inicio');
  const lit = soma(ab,r=>r.litros), custo = soma(ab,r=>(+r.litros||0)*(+r.valorLitro||0));
  const porTipo = t => soma(ab.filter(a=>equip(a.equipId)?.tipo===t),r=>r.litros);
  const horas = soma(os,o=>horasEntre(o.inicio,o.fim)), hh = soma(os,o=>horasEntre(o.inicio,o.fim)*(+o.qtdColab||0));
  return { ab, ny, os, lit, custo, roc:porTipo('Roçadeira Costal'), tra:porTipo('Trator'), nylon:soma(ny,r=>r.nylon), faca:soma(ny,r=>r.faca), horas, hh };
}
function painelCombustivel(){
  const r = resumoCombustivel();
  return `<div class="kpis">${kpi('Combustível', num(r.lit)+' L', r.custo?brl(r.custo):'sem valor informado')}${kpi('Roçadeiras costais', num(r.roc)+' L')}${kpi('Tratores', num(r.tra)+' L')}
    ${kpi('Nylon / Faca', `${num(r.nylon)} / ${num(r.faca,0)}`, r.ny.length+' lançamentos')}${kpi('Ordens de serviço', r.os.length, hhmm(r.horas)+' trabalhadas')}
    ${kpi('Homem-hora', num(r.hh), r.lit&&r.hh?num(r.lit/r.hh)+' L por homem-hora':'')}</div>
    <div class="grid2"><div class="card"><h2>Combustível por equipamento</h2><div class="tabela-wrap">${tabelaBarras(['Equipamento','Litros'], agrupa(r.ab,a=>nomeEquip(a.equipId),a=>a.litros), v=>num(v)+' L')}</div></div>
    <div class="card"><h2>Combustível por colaborador</h2><div class="tabela-wrap">${tabelaBarras(['Colaborador','Litros'], agrupa(r.ab,a=>nomeColab(a.colabId),a=>a.litros), v=>num(v)+' L')}</div></div></div>`;
}
function resumoRH(){
  const ativos = L('colaboradores').filter(ativoColab), previsto = soma(L('quadro'),q=>q.previsto);
  const oc = doMes(L('ocorrencias'),'data'), j = jornada();
  const horasOc = r => (+r.dias||0)*j + (+r.horas||0);
  const aus = oc.filter(o=>AUSENCIAS.includes(o.tipo)), ausH = soma(aus,horasOc);
  const horasPrev = ativos.length*diasUteis()*j;
  const abs = est.mes && horasPrev ? ausH/horasPrev*100 : null;
  const he50 = soma(oc.filter(o=>o.tipo==='Hora extra 50%'),horasOc), he100 = soma(oc.filter(o=>o.tipo==='Hora extra 100%'),horasOc);
  const vagas = [...new Set(L('quadro').map(q=>q.funcao))].reduce((n,fn)=>n+Math.max(0, soma(L('quadro').filter(q=>q.funcao===fn),q=>q.previsto) - ativos.filter(c=>c.funcao===fn).length),0);
  return { ativos, previsto, vagas, oc, ausH, abs, he50, he100, horasOc, faltas: soma(oc.filter(o=>o.tipo==='Falta'),r=>r.dias) };
}
function painelRH(){
  const r = resumoRH();
  const fs = [...new Set([...L('quadro').map(q=>q.funcao), ...r.ativos.map(c=>c.funcao||'Sem função')])].sort();
  const linhasQ = fs.map(fn=>{ const p=soma(L('quadro').filter(q=>q.funcao===fn),q=>q.previsto), a=r.ativos.filter(c=>(c.funcao||'Sem função')===fn).length, d=a-p;
    return `<tr><td>${esc(fn)}</td><td class="num">${num(p,0)}</td><td class="num">${num(a,0)}</td><td class="num">${d===0?tag('completo'):d<0?tag(d,'d'):tag('+'+d,'w')}</td></tr>`; });
  const porColab = {};
  r.oc.forEach(o=>{ const p=porColab[o.colabId]=porColab[o.colabId]||{aus:0,faltas:0,he:0}; const h=r.horasOc(o);
    if(AUSENCIAS.includes(o.tipo)) p.aus+=h; if(o.tipo==='Falta') p.faltas+=(+o.dias||0); if(o.tipo.startsWith('Hora extra')) p.he+=h; });
  const linhasC = Object.entries(porColab).sort((a,b)=>(b[1].aus+b[1].he)-(a[1].aus+a[1].he)).map(([id,p])=>`<tr><td>${esc(nomeColab(id))}</td><td class="num">${num(p.faltas,1)}</td><td class="num">${num(p.aus)}</td><td class="num">${num(p.he)}</td></tr>`);
  return `<div class="kpis">${kpi('Efetivo ativo', r.ativos.length, 'previsto: '+num(r.previsto,0))}${kpi('Vagas em aberto', r.vagas, 'funções abaixo do previsto')}
    ${kpi('Absenteísmo', r.abs===null?'—':num(r.abs,1)+'%', r.abs===null?'escolha um mês':num(r.ausH)+' h de ausência')}${kpi('Faltas', num(r.faltas,1)+' dias')}
    ${kpi('Hora extra 50%', num(r.he50)+' h')}${kpi('Hora extra 100%', num(r.he100)+' h')}</div>
    <div class="grid2"><div class="card"><h2>Quadro previsto x efetivo</h2><div class="tabela-wrap"><table><thead><tr><th>Função</th><th class="num">Previsto</th><th class="num">Ativos</th><th class="num">Diferença</th></tr></thead><tbody>${linhasQ.join('')||'<tr><td class="vazio" colspan="4">Cadastre o quadro previsto e os colaboradores.</td></tr>'}</tbody></table></div></div>
    <div class="card"><h2>Ocorrências por colaborador</h2><div class="tabela-wrap"><table><thead><tr><th>Colaborador</th><th class="num">Faltas (dias)</th><th class="num">Ausência (h)</th><th class="num">Hora extra (h)</th></tr></thead><tbody>${linhasC.join('')||'<tr><td class="vazio" colspan="4">Sem ocorrências no período.</td></tr>'}</tbody></table></div></div></div>
    <p class="info">Absenteísmo = horas de falta, falta justificada, atestado e atraso ÷ (efetivo ativo × ${diasUteis()} dias úteis × ${num(jornada())} h). Dias úteis e jornada são ajustados no cadastro do contrato.</p>`;
}
function resumoEquip(){
  const eq = L('equipamentos').filter(ativoEquip), mt = doMes(L('manutencoes'),'data');
  const conta = s => eq.filter(e=>e.situacao===s).length;
  return { eq, mt, operando:conta('Operando'), manut:conta('Em manutenção'), parado:conta('Parado'), abertas:L('manutencoes').filter(m=>m.status!=='Concluída').length, horas:soma(mt,m=>m.horasParado), custo:soma(mt,m=>m.custo) };
}
function painelEquip(){
  const r = resumoEquip();
  const fora = r.eq.filter(e=>e.situacao!=='Operando').map(e=>`<tr><td>${esc(e.codigo)}</td><td>${esc(e.tipo)}</td><td>${esc(e.modelo)}</td><td>${sitTag(e.situacao)}</td></tr>`);
  const abertas = L('manutencoes').filter(m=>m.status!=='Concluída').sort((a,b)=>String(a.data).localeCompare(b.data)).map(m=>`<tr><td>${dataBR(m.data)}</td><td>${esc(nomeEquip(m.equipId))}</td><td>${esc(m.descricao)}</td><td>${sitTag(m.status)}</td></tr>`);
  return `<div class="kpis">${kpi('Equipamentos ativos', r.eq.length)}${kpi('Operando', r.operando, r.eq.length?num(r.operando/r.eq.length*100,0)+'% da frota':'')}${kpi('Em manutenção', r.manut)}${kpi('Parados', r.parado)}
    ${kpi('Manutenções abertas', r.abertas)}${kpi('Manutenções no período', r.mt.length, num(r.horas)+' h parado · '+brl(r.custo))}</div>
    <div class="grid2"><div class="card"><h2>Fora de operação</h2><div class="tabela-wrap"><table><thead><tr><th>Código</th><th>Tipo</th><th>Modelo</th><th>Situação</th></tr></thead><tbody>${fora.join('')||'<tr><td class="vazio" colspan="4">Todos operando.</td></tr>'}</tbody></table></div></div>
    <div class="card"><h2>Manutenções em aberto</h2><div class="tabela-wrap"><table><thead><tr><th>Abertura</th><th>Equipamento</th><th>Defeito / serviço</th><th>Status</th></tr></thead><tbody>${abertas.join('')||'<tr><td class="vazio" colspan="4">Nenhuma em aberto.</td></tr>'}</tbody></table></div></div></div>
    <div class="card"><h2>Custo de manutenção por equipamento</h2><div class="tabela-wrap">${tabelaBarras(['Equipamento','Custo'], agrupa(r.mt,m=>nomeEquip(m.equipId),m=>m.custo).filter(p=>p[1]>0), brl)}</div></div>
    <p class="info">Para mudar a situação de um equipamento (Operando, Em manutenção, Parado), edite-o em Cadastros → Equipamentos.</p>`;
}
function resumoFardos(){
  const fd = doMes(L('fardos'),'data'), q = soma(fd,r=>r.quantidade), p = soma(fd,r=>r.peso);
  return { fd, q, p, media: q&&p ? p/q : 0, dias: new Set(fd.map(r=>r.data)).size };
}
function painelFardos(){
  const r = resumoFardos();
  const porPrensa = Object.entries(r.fd.reduce((g,f)=>{ const k=nomeEquip(f.prensaId); g[k]=g[k]||[0,0]; g[k][0]+=+f.quantidade||0; g[k][1]+=+f.peso||0; return g; },{})).sort((a,b)=>b[1][0]-a[1][0]).map(([n,[q,p]])=>[n,q,num(p/1000,2)+' t']);
  const porMat = Object.entries(r.fd.reduce((g,f)=>{ const k=f.material||'—'; g[k]=g[k]||[0,0]; g[k][0]+=+f.quantidade||0; g[k][1]+=+f.peso||0; return g; },{})).sort((a,b)=>b[1][0]-a[1][0]).map(([n,[q,p]])=>[n,q,num(p/1000,2)+' t']);
  const porDia = agrupa(r.fd,f=>f.data,f=>f.quantidade).sort((a,b)=>a[0].localeCompare(b[0])).map(([d,v])=>[dataBR(d),v]);
  return `<div class="kpis">${kpi('Fardos produzidos', num(r.q,0), r.dias+' dias com produção')}${kpi('Peso total', num(r.p/1000,2)+' t', num(r.p,0)+' kg')}
    ${kpi('Peso médio por fardo', r.media?num(r.media,1)+' kg':'—')}${kpi('Média por dia', r.dias?num(r.q/r.dias,1)+' fardos':'—')}</div>
    <div class="grid2"><div class="card"><h2>Por prensa</h2><div class="tabela-wrap">${tabelaBarras(['Prensa','Fardos','Peso'], porPrensa, v=>num(v,0))}</div></div>
    <div class="card"><h2>Por material</h2><div class="tabela-wrap">${tabelaBarras(['Material','Fardos','Peso'], porMat, v=>num(v,0))}</div></div></div>
    <div class="card"><h2>Fardos por dia</h2><div class="tabela-wrap">${tabelaBarras(['Dia','Fardos'], porDia, v=>num(v,0))}</div></div>
    ${L('equipamentos').some(e=>e.tipo==='Prensa')?'':'<p class="info">Cadastre as prensas em Cadastros → Equipamentos com o tipo "Prensa" para poder lançar a produção.</p>'}`;
}
function painelGeral(){
  const ids = modulosDoContrato().map(m=>m.id);
  let h = '';
  if(ids.includes('combustivel')){ const r=resumoCombustivel(); h+=`<h3>Combustível</h3><div class="kpis">${kpi('Combustível', num(r.lit)+' L', r.custo?brl(r.custo):'')}${kpi('Nylon / Faca', `${num(r.nylon)} / ${num(r.faca,0)}`)}${kpi('Ordens de serviço', r.os.length, num(r.hh)+' homem-hora')}</div>`; }
  if(ids.includes('rh')){ const r=resumoRH(); h+=`<h3>RH</h3><div class="kpis">${kpi('Efetivo ativo / previsto', `${r.ativos.length} / ${num(r.previsto,0)}`)}${kpi('Absenteísmo', r.abs===null?'—':num(r.abs,1)+'%')}${kpi('Horas extras', num(r.he50+r.he100)+' h', `50%: ${num(r.he50)} h · 100%: ${num(r.he100)} h`)}</div>`; }
  if(ids.includes('equipamentos')){ const r=resumoEquip(); h+=`<h3>Equipamentos</h3><div class="kpis">${kpi('Operando', `${r.operando} de ${r.eq.length}`)}${kpi('Manutenções abertas', r.abertas)}${kpi('Custo de manutenção', brl(r.custo), num(r.horas)+' h parado')}</div>`; }
  if(ids.includes('fardos')){ const r=resumoFardos(); h+=`<h3>Produção de fardos</h3><div class="kpis">${kpi('Fardos', num(r.q,0))}${kpi('Peso total', num(r.p/1000,2)+' t')}${kpi('Peso médio', r.media?num(r.media,1)+' kg/fardo':'—')}</div>`; }
  const vazio = !L('colaboradores').length && !L('equipamentos').length;
  return (vazio?`<div class="card"><h2>Primeiros passos</h2><p style="margin:0">Comece por <b>Cadastros</b>: inclua os colaboradores e os equipamentos deste contrato. Depois, cada módulo já consegue receber lançamentos.</p></div>`:'') + h;
}

/* ===================== TELAS ===================== */
function telaContratos(){
  $('#barraContrato').hidden = true; $('#navMods').hidden = true; $('#btnContratos').hidden = true; $('#btnBackup').hidden = true;
  const ordem = {Ativo:0,Suspenso:1,Encerrado:2};
  const cards = [...contratos].sort((a,b)=>(ordem[a.status]??0)-(ordem[b.status]??0)||String(a.nome).localeCompare(b.nome)).map(c=>{
    const mods = (c.modulos?.length?c.modulos:MODULOS_OPCIONAIS.map(m=>m[0])).map(id=>tag(MODULOS_OPCIONAIS.find(m=>m[0]===id)?.[1]||id,'n')).join('');
    return `<div class="contrato"><div class="t">${esc(c.nome)}</div><div class="s">${esc([c.cliente,c.local].filter(Boolean).join(' · '))}${c.numero?' · Nº '+esc(c.numero):''}</div>
      <div>${sitTag(c.status||'Ativo')}${c.inicio?` <span class="s">${dataBR(c.inicio)}${c.fim?' a '+dataBR(c.fim):''}</span>`:''}</div><div class="mods">${mods}</div>
      <div class="linha-botoes"><button class="pri" data-abrir="${c.id}">Abrir</button><button data-editar="contratos|${c.id}">Editar</button><button class="del" data-excluir="contratos|${c.id}">Excluir</button></div></div>`;
  });
  $('#conteudo').innerHTML = `<h2>Contratos</h2>
    <details class="card" id="novoContrato" ${contratos.length?'':'open'}><summary>+ Novo contrato</summary><div class="card" style="border:none;padding:0;margin:0"><h2 hidden></h2>${formHTML('contratos')}</div></details>
    <div class="contratos">${cards.join('') || '<p class="info">Nenhum contrato cadastrado ainda. Use "+ Novo contrato" acima.</p>'}</div>`;
  prepararForm('contratos');
}
function telaDoContrato(){
  const mods = modulosDoContrato();
  if(!mods.some(m=>m.id===est.mod)){ est.mod='geral'; est.aba=0; }
  const mod = mods.find(m=>m.id===est.mod), aba = mod.abas[est.aba] || mod.abas[0];
  $('#btnContratos').hidden = false; $('#btnBackup').hidden = false;
  const bc = $('#barraContrato'); bc.hidden = false;
  bc.innerHTML = `<div><div class="nome">${esc(contrato.nome)}</div><div class="sub">${esc([contrato.cliente,contrato.local].filter(Boolean).join(' · '))}</div></div>
    <div class="mes"><label style="flex-direction:row;align-items:center;gap:6px">Mês <input type="month" id="mesRef" value="${est.mes}" ${est.mes?'':'disabled'}></label>
    <label style="flex-direction:row;align-items:center;gap:6px"><input type="checkbox" id="todosMeses" ${est.mes?'':'checked'}> todos os meses</label></div>`;
  $('#mesRef').addEventListener('change', e=>{ est.mes = e.target.value || hoje().slice(0,7); renderTudo(); });
  $('#todosMeses').addEventListener('change', e=>{ est.mes = e.target.checked ? '' : hoje().slice(0,7); renderTudo(); });
  const nav = $('#navMods'); nav.hidden = false;
  nav.innerHTML = mods.map(m=>`<button data-mod="${m.id}" class="${m.id===est.mod?'ativo':''}">${esc(m.nome)}</button>`).join('');
  const abas = mod.abas.length>1 ? `<nav class="abas">${mod.abas.map((a,i)=>`<button data-aba="${i}" class="${a===aba?'ativo':''}">${esc(a.nome)}</button>`).join('')}</nav>` : '';
  $('#conteudo').innerHTML = abas + (aba.ent ? telaEntidade(aba.ent) : aba.painel());
  if(aba.ent) prepararForm(aba.ent);
}
function renderTudo(){ if(contrato) telaDoContrato(); else telaContratos(); }

/* ===================== EVENTOS ===================== */
document.addEventListener('click', async e=>{
  const b = e.target.closest('button'); if(!b) return;
  if(b.dataset.mod){ est.mod=b.dataset.mod; est.aba=0; renderTudo(); window.scrollTo(0,0); }
  else if(b.dataset.aba!==undefined && b.closest('nav.abas')){ est.aba=+b.dataset.aba; renderTudo(); }
  else if(b.dataset.editar){ const [k,id]=b.dataset.editar.split('|'); editarForm(k,id); }
  else if(b.dataset.excluir){ const [k,id]=b.dataset.excluir.split('|'); excluir(k,id); }
  else if(b.dataset.limpar){ limparForm(b.dataset.limpar); }
  else if(b.dataset.csv){ exportarCSV(b.dataset.csv); }
  else if(b.dataset.abrir){ contrato = contratos.find(c=>c.id===b.dataset.abrir); est.mod='geral'; est.aba=0; db={}; await carregarContrato(); renderTudo(); window.scrollTo(0,0); }
});
$('#btnContratos').addEventListener('click', ()=>{ contrato=null; db={}; renderTudo(); });
$('#logo').addEventListener('click', ()=>{ contrato=null; db={}; renderTudo(); });
$('#btnAtualizar').addEventListener('click', async ()=>{ await carregarContratos(); if(contrato){ contrato=contratos.find(c=>c.id===contrato.id)||null; if(contrato) await carregarContrato(); } renderTudo(); toast('Dados atualizados.'); });
$('#btnBackup').addEventListener('click', ()=>baixar(`backup_${(contrato.nome||'contrato').replace(/[^\w]+/g,'_')}_${hoje()}.json`, JSON.stringify({contrato, dados:db},null,2), 'application/json'));
$('#btnSair').addEventListener('click', async ()=>{ await sb.auth.signOut(); location.reload(); });

function baixar(nome, conteudo, tipo){
  const a=document.createElement('a'); a.href=URL.createObjectURL(new Blob([conteudo],{type:tipo})); a.download=nome; a.click(); setTimeout(()=>URL.revokeObjectURL(a.href),1000);
}
function exportarCSV(k){
  const E = ENT[k], l = listaEnt(k), txt = h => String(h).replace(/<[^>]+>/g,'').replace(/&amp;/g,'&').replace(/&lt;/g,'<').replace(/&gt;/g,'>').replace(/&quot;/g,'"').replace(/&#39;/g,"'");
  const cab = [...E.cols.map(c=>c.l), 'Observação'];
  const linhas = l.map(r=>[...E.cols.map(c=>txt(c.v(r))), r.obs||'']);
  const csv = [cab,...linhas].map(x=>x.map(v=>`"${String(v??'').replace(/"/g,'""')}"`).join(';')).join('\r\n');
  baixar(`${k}_${(contrato?.nome||'').replace(/[^\w]+/g,'_')}_${est.mes||'todos'}.csv`, '\ufeff'+csv, 'text/csv;charset=utf-8');
}

/* ===================== LOGIN ===================== */
const telaLogin = $('#telaLogin');
let iniciado = false;
function mostrarLogin(modo){
  telaLogin.hidden = false;
  $('#fLogin').hidden = modo==='senha';
  $('#fNovaSenha').hidden = modo!=='senha';
  $('#loginTitulo').textContent = modo==='senha' ? 'Criar senha de acesso' : 'SGC – Gerenciamento de Contratos';
}
async function entrarNoSistema(session){
  telaLogin.hidden = true;
  $('#usuarioEmail').textContent = session.user.email;
  if(iniciado) return; iniciado = true;
  await carregarContratos(); renderTudo();
}
$('#fLogin').addEventListener('submit', async e=>{
  e.preventDefault(); const f=e.target; $('#loginErro').textContent='';
  if(!f.senha.value){ $('#loginErro').textContent='Digite a senha.'; return; }
  $('#loginBotao').disabled = true;
  const { error } = await sb.auth.signInWithPassword({ email:f.email.value.trim(), password:f.senha.value });
  $('#loginBotao').disabled = false;
  if(error) $('#loginErro').textContent = error.message.includes('Invalid') ? 'E-mail ou senha incorretos.' : error.message;
});
$('#linkEsqueci').addEventListener('click', async ()=>{
  const email = $('#fLogin').email.value.trim();
  if(!email){ $('#loginErro').textContent='Digite seu e-mail acima e clique de novo em "Esqueci minha senha".'; return; }
  const { error } = await sb.auth.resetPasswordForEmail(email, { redirectTo: location.origin + location.pathname });
  $('#loginErro').textContent = error ? error.message : 'Enviamos um link para criar uma nova senha no seu e-mail.';
});
$('#fNovaSenha').addEventListener('submit', async e=>{
  e.preventDefault(); const f=e.target;
  if(f.senha.value!==f.senha2.value){ $('#novaSenhaErro').textContent='As senhas não são iguais.'; return; }
  const { error } = await sb.auth.updateUser({ password:f.senha.value });
  if(error){ $('#novaSenhaErro').textContent=error.message; return; }
  history.replaceState(null,'',location.pathname); f.reset();
  entrarNoSistema((await sb.auth.getSession()).data.session);
});

/* ===================== INÍCIO ===================== */
sb.auth.onAuthStateChange((evento, session)=>{
  setTimeout(()=>{
    if(evento==='PASSWORD_RECOVERY' || (session && PRECISA_SENHA)){ PRECISA_SENHA = false; mostrarLogin('senha'); return; }
    if(!telaLogin.hidden && !$('#fNovaSenha').hidden) return; // aguardando a pessoa criar a senha
    if(session) entrarNoSistema(session); else mostrarLogin('login');
  },0);
});
</script>
