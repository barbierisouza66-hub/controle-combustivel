<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>SGC – Sistema de Gerenciamento de Contratos</title>
<style>
  :root{
    --bg:#f4f6f5; --card:#fff; --ink:#1d2a24; --muted:#6b7a72; --line:#dfe5e1;
    --pri:#1f6f4a; --pri2:#e6f2ec; --warn:#b4541b; --warn2:#fdf0e7; --danger:#b42318; --danger2:#fdecea;
  }
  *{box-sizing:border-box}
  [hidden]{display:none!important}
  body{margin:0;font-family:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;background:var(--bg);color:var(--ink);font-size:15px}
  header{background:var(--pri);color:#fff;padding:12px 20px;display:flex;align-items:center;justify-content:space-between;flex-wrap:wrap;gap:10px}
  header h1{font-size:18px;margin:0;font-weight:600;cursor:pointer}
  header h1 small{font-weight:400;opacity:.8;font-size:13px;margin-left:6px}
  header .acoes{display:flex;gap:6px;align-items:center;flex-wrap:wrap}
  header .acoes button{background:rgba(255,255,255,.15);color:#fff;border:1px solid rgba(255,255,255,.35)}
  .usuario{font-size:13px;opacity:.9;margin-right:6px}
  .barra-contrato{background:#fff;border-bottom:1px solid var(--line);padding:12px 20px;display:flex;gap:14px;align-items:center;flex-wrap:wrap}
  .barra-contrato .nome{font-weight:600;font-size:16px}
  .barra-contrato .sub{color:var(--muted);font-size:13px}
  .barra-contrato .mes{margin-left:auto;display:flex;gap:10px;align-items:center;font-size:13px;color:var(--muted)}
  nav.mods{display:flex;gap:4px;padding:0 16px;background:#fff;border-bottom:1px solid var(--line);overflow-x:auto}
  nav.mods button{background:none;border:none;border-bottom:3px solid transparent;border-radius:0;padding:13px 14px;color:var(--muted);font-weight:500;white-space:nowrap}
  nav.mods button.ativo{color:var(--pri);border-bottom-color:var(--pri)}
  nav.abas{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:16px}
  nav.abas button{border-radius:20px;padding:6px 14px;font-size:14px}
  nav.abas button.ativo{background:var(--pri);color:#fff;border-color:var(--pri)}
  main{max-width:1250px;margin:0 auto;padding:20px 16px 60px}
  h2{font-size:17px;margin:0 0 14px}
  h3{font-size:15px;margin:22px 0 10px;color:var(--muted);font-weight:600}
  .card{background:var(--card);border:1px solid var(--line);border-radius:10px;padding:18px;margin-bottom:18px}
  .grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(190px,1fr));gap:12px}
  .grid2{display:grid;grid-template-columns:repeat(auto-fit,minmax(360px,1fr));gap:18px}
  label{display:flex;flex-direction:column;font-size:13px;color:var(--muted);gap:4px}
  label.largo{margin-top:12px}
  .lbl{display:flex;flex-direction:column;font-size:13px;color:var(--muted);gap:4px}
  .opcoes{display:flex;gap:16px;flex-wrap:wrap;padding:7px 0}
  label.chk{flex-direction:row;align-items:center;gap:7px;color:var(--ink);font-size:14px;cursor:pointer}
  label.chk input{width:18px;height:18px;margin:0;accent-color:var(--pri);cursor:pointer}
  .cal{display:grid;grid-template-columns:repeat(7,minmax(150px,1fr));gap:6px}
  .cal .cab{font-size:12px;font-weight:600;color:var(--muted);text-transform:uppercase;text-align:center;padding:4px}
  .cal .d{border:1px solid var(--line);border-radius:8px;padding:7px 8px;background:#fff;min-height:118px;display:flex;flex-direction:column;gap:3px}
  .cal .d.fora{background:transparent;border:none}
  .cal .d.fds{background:#f6f7f6}
  .cal .d.hoje{border-color:var(--pri);box-shadow:inset 0 0 0 1px var(--pri)}
  .cal .d.st-P{background:#eef7f2}
  .cal .d.st-A{background:#fdf3f2}
  .cal .d.st-AT{background:#fdf5ee}
  .cal .d.mudou{box-shadow:inset 3px 0 0 var(--warn)}
  .cal .d .n{font-weight:600;font-size:14px;display:flex;justify-content:space-between}
  .cal .d .n small{font-weight:400;color:var(--muted)}
  .cal .d label.chk{font-size:12.5px;gap:5px}
  .cal .d label.chk input{width:15px;height:15px}
  .cal .d select,.cal .d input[type=text],.cal .d input[type=number]{font-size:12px;padding:3px 5px;width:100%}
  .cal .d .hecalc{font-size:11.5px;color:var(--muted);line-height:1.35}
  .cal .d .hecalc .he{color:var(--warn)}
  .cal .d .hecalc .rs{color:var(--pri)}
  .cal .d .hecalc .neg{color:var(--danger)}
  .cal .d.fer{background:#fff7ef}
  input.calc{background:var(--pri2);font-weight:600;color:var(--pri);cursor:default}
  .cal .d .campoh{display:flex;flex-direction:column;gap:2px;font-size:11.5px;font-weight:600;color:var(--warn)}
  .cal .d .campoh input{font-weight:600;border-color:var(--warn);font-size:12px;padding:3px 4px;width:100%}
  .cal .d .campoh label{display:flex;flex-direction:column;gap:1px;font-size:11px;font-weight:500;color:var(--muted)}
  .cal .d .campoh .heh{display:flex;flex-direction:column;gap:3px}
  .cal .d .campoh .heh label{flex-direction:row;align-items:center;gap:4px}
  .cal .d .campoh .heh label input{flex:1;min-width:0}
  .cal .d .abono{font-size:12px;font-weight:600;color:var(--pri);background:var(--pri2);border-radius:6px;padding:4px 6px;margin:2px 0}
  .holerite td{white-space:normal}
  .holerite tr.sub td{background:#fafbfa;border-top:2px solid var(--line)}
  .holerite tr.neg td:last-child{color:var(--danger)}
  .holerite tr.secao td{background:var(--pri);color:#fff;font-weight:600;font-size:13px;text-transform:uppercase;letter-spacing:.03em}
  .holerite tr.secao .info{color:#e6f2ec}
  .holerite tr.total td{background:var(--pri2);font-size:15px;border-top:2px solid var(--pri)}
  .valorbox{display:flex;gap:18px;align-items:center;flex-wrap:wrap;background:var(--pri2);border:1px solid #b9dcc9;border-radius:10px;padding:12px 16px;margin-bottom:14px}
  .valorbox b{font-size:15px;color:var(--pri)}
  .valorbox label{flex-direction:row;align-items:center;gap:8px;color:var(--ink);font-size:14px;font-weight:600}
  .valorbox input{width:130px;font-size:16px;font-weight:600}
  input,select,textarea{font:inherit;padding:8px 10px;border:1px solid var(--line);border-radius:6px;background:#fff;color:var(--ink)}
  input:focus,select:focus,textarea:focus{outline:2px solid var(--pri2);border-color:var(--pri)}
  button{font:inherit;cursor:pointer;padding:8px 14px;border-radius:6px;border:1px solid var(--line);background:#fff;color:var(--ink)}
  button.pri{background:var(--pri);color:#fff;border-color:var(--pri)}
  button.peq{padding:4px 9px;font-size:13px}
  button.del{color:var(--danger)}
  .linha-botoes{display:flex;gap:8px;margin-top:14px;flex-wrap:wrap}
  .tabela-wrap{overflow-x:auto}
  table{width:100%;border-collapse:collapse;font-size:14px}
  th,td{padding:8px 10px;border-bottom:1px solid var(--line);text-align:left;white-space:nowrap}
  th{color:var(--muted);font-weight:500;font-size:12px;text-transform:uppercase;letter-spacing:.03em;background:#fafbfa}
  td.num,th.num{text-align:right;font-variant-numeric:tabular-nums}
  tr.total td{font-weight:600;background:#fafbfa}
  .vazio{color:var(--muted);text-align:center;padding:24px}
  .kpis{display:grid;grid-template-columns:repeat(auto-fit,minmax(170px,1fr));gap:12px;margin-bottom:18px}
  .kpi{background:#fff;border:1px solid var(--line);border-radius:10px;padding:14px 16px}
  .kpi .v{font-size:23px;font-weight:600;margin-top:4px;font-variant-numeric:tabular-nums}
  .kpi .r{font-size:12px;color:var(--muted)}
  .filtros{display:flex;gap:10px;align-items:center;flex-wrap:wrap;margin-bottom:14px}
  .barra{height:8px;background:var(--pri2);border-radius:4px;overflow:hidden;min-width:80px}
  .barra i{display:block;height:100%;background:var(--pri)}
  .tag{display:inline-block;padding:2px 8px;border-radius:10px;font-size:12px;background:var(--pri2);color:var(--pri)}
  .tag.w{background:var(--warn2);color:var(--warn)}
  .tag.d{background:var(--danger2);color:var(--danger)}
  .tag.n{background:#eef0ef;color:var(--muted)}
  .checks{display:flex;flex-wrap:wrap;gap:6px 14px;padding:8px;border:1px solid var(--line);border-radius:6px;max-height:150px;overflow:auto}
  .checks label{flex-direction:row;align-items:center;gap:6px;color:var(--ink);font-size:14px}
  .info{font-size:13px;color:var(--muted);margin-top:8px}
  .contratos{display:grid;grid-template-columns:repeat(auto-fill,minmax(280px,1fr));gap:14px}
  .contrato{background:#fff;border:1px solid var(--line);border-radius:10px;padding:16px;display:flex;flex-direction:column;gap:8px}
  .contrato .t{font-weight:600;font-size:16px}
  .contrato .s{color:var(--muted);font-size:13px}
  .contrato .mods{display:flex;flex-wrap:wrap;gap:4px}
  .contrato .linha-botoes{margin-top:auto;padding-top:6px}
  table.freq td{padding:5px 6px;vertical-align:middle}
  table.freq input,table.freq select{padding:4px 6px;font-size:13px}
  table.freq input[type=number]{width:64px}
  table.freq input[type=time]{width:112px}
  table.freq input[name=cid]{width:80px;text-transform:uppercase}
  table.freq input[name=obs]{width:150px}
  table.freq .s{font-size:12px;color:var(--muted)}
  table.freq tr.alterada td:first-child{box-shadow:inset 3px 0 0 var(--warn)}
  table.freq input:disabled{background:#f3f4f3;color:#aaa}
  table.grade{font-size:12px}
  table.grade th,table.grade td{padding:3px 2px;text-align:center;white-space:nowrap}
  table.grade th.dia{cursor:pointer;font-size:12px;line-height:1.1;min-width:38px}
  table.grade th.dia:hover{color:var(--pri);text-decoration:underline}
  table.grade th.hoje{background:var(--pri2);color:var(--pri)}
  table.grade .fds{background:#f1f3f2}
  table.grade .nome{text-align:left;position:sticky;left:0;background:#fff;z-index:1;padding:4px 8px;min-width:150px;box-shadow:1px 0 0 var(--line)}
  table.grade thead .nome{background:#fafbfa}
  table.grade .nome .s{font-size:11px;color:var(--muted)}
  table.grade .tot{font-weight:600;background:#fafbfa;min-width:52px;font-size:12px}
  table.grade .tot.ult{box-shadow:inset -2px 0 0 var(--line)}
  main:has(table.grade){max-width:none}
  table.grade select.cel{width:40px;padding:3px 0;font-size:12px;font-weight:600;text-align:center;text-align-last:center;appearance:none;-webkit-appearance:none;border-radius:4px;cursor:pointer}
  table.grade td.abo select.cel{font-style:italic}
  table.grade td.prev select.cel{outline:2px dashed var(--warn);outline-offset:-2px}
  select.cel.s-P{background:#e6f2ec;color:#1f6f4a;border-color:#b9dcc9}
  select.cel.s-F,select.cel.s-FJ{background:#fdecea;color:#b42318;border-color:#f3c1bb}
  select.cel.s-A{background:#fdf0e7;color:#b4541b;border-color:#f2cfb6}
  select.cel.s-AF{background:#f3e8fb;color:#7a2fa8;border-color:#dcc3ef}
  select.cel.s-FE,select.cel.s-FO,select.cel.s-FR{background:#eef0ef;color:#555}
  details.card summary{cursor:pointer;font-weight:600}
  details.card[open] summary{margin-bottom:14px}
  .toast{position:fixed;bottom:20px;left:50%;transform:translateX(-50%);background:var(--ink);color:#fff;padding:10px 18px;border-radius:8px;opacity:0;transition:.25s;pointer-events:none;z-index:70}
  .toast.on{opacity:1}
  #telaLogin{position:fixed;inset:0;background:var(--bg);display:flex;align-items:center;justify-content:center;z-index:50;padding:16px}
  #telaLogin .card{width:100%;max-width:380px}
  #telaLogin form{display:flex;flex-direction:column;gap:12px}
  #telaLogin .erro{color:var(--danger);font-size:13px;min-height:18px}
  #telaLogin a{color:var(--pri);font-size:13px;cursor:pointer}
  .carregando{position:fixed;top:0;left:0;right:0;height:3px;background:linear-gradient(90deg,transparent,var(--pri),transparent);background-size:200% 100%;animation:car 1s linear infinite;z-index:60;display:none}
  .carregando.on{display:block}
  #avisoVersao{position:sticky;top:0;z-index:80;background:#fdf0e7;color:var(--warn);border-bottom:1px solid #f2cfb6;padding:10px 20px;font-weight:600;display:flex;gap:12px;align-items:center;justify-content:center}
  .alerta{background:#fdecea;color:var(--danger);border:1px solid #f3c1bb;border-radius:8px;padding:10px 14px;margin:0 0 12px}
  #avisoVersao button{background:var(--warn);color:#fff;border-color:var(--warn)}
  @keyframes car{from{background-position:100% 0}to{background-position:-100% 0}}
  @media print{header .acoes,nav,form,.linha-botoes,button,details{display:none!important}}
</style>
</head>
<body>
<div class="carregando" id="carregando"></div>
<div id="avisoVersao" hidden>Há uma versão nova do sistema disponível. <button id="btnNovaVersao">Atualizar agora</button></div>

<div id="telaLogin">
  <div class="card">
    <h2 id="loginTitulo">SGC – Gerenciamento de Contratos</h2>
    <form id="fLogin">
      <label>E-mail <input type="email" name="email" required autocomplete="username"></label>
      <label>Senha <input type="password" name="senha" autocomplete="current-password"></label>
      <div class="erro" id="loginErro"></div>
      <button class="pri" type="submit" id="loginBotao">Entrar</button>
      <a id="linkEsqueci">Esqueci minha senha</a>
    </form>
    <form id="fNovaSenha" hidden>
      <p class="info" style="margin:0">Crie sua senha de acesso (mínimo 6 caracteres).</p>
      <label>Nova senha <input type="password" name="senha" minlength="6" required autocomplete="new-password"></label>
      <label>Repita a senha <input type="password" name="senha2" minlength="6" required autocomplete="new-password"></label>
      <div class="erro" id="novaSenhaErro"></div>
      <button class="pri" type="submit">Salvar senha e entrar</button>
    </form>
  </div>
</div>

<header>
  <h1 id="logo">SGC <small>Sistema de Gerenciamento de Contratos · versão <span id="versao"></span></small></h1>
  <div class="acoes">
    <span class="usuario" id="usuarioEmail"></span>
    <button id="btnContratos" hidden>← Contratos</button>
    <button id="btnAtualizar">Atualizar</button>
    <button id="btnBackup" hidden>Salvar backup</button>
    <button id="btnSair">Sair</button>
  </div>
</header>

<div id="barraContrato" class="barra-contrato" hidden></div>
<nav class="mods" id="navMods" hidden></nav>
<main id="conteudo"></main>
<div class="toast" id="toast"></div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script>
/* ===================== VERSÃO ===================== */
const VERSAO = '3.0';
document.getElementById('versao').textContent = VERSAO;
// Confere de tempos em tempos se foi publicada uma versão nova e avisa para recarregar.
async function checarVersao(){
  try{
    const t = await fetch(location.pathname + '?v=' + Date.now(), { cache:'no-store' }).then(r=>r.text());
    const nova = (t.match(/const VERSAO = '([\d.]+)'/)||[])[1];
    if(nova && nova !== VERSAO) document.getElementById('avisoVersao').hidden = false;
  }catch(e){}
}
setInterval(checarVersao, 120000);
window.addEventListener('focus', checarVersao);
document.getElementById('btnNovaVersao').addEventListener('click', ()=>location.reload());

/* ===================== SUPABASE ===================== */
const SUPABASE_URL = 'https://xmxcdrtrdvxjkzfxbxsl.supabase.co';
const SUPABASE_KEY = 'sb_publishable_n_SJIeAlMHqsSbU01hA-Rg_djL-Utos';
// Links de convite ou de "esqueci a senha" chegam com type=invite/recovery: nesses casos pedimos para criar a senha.
let PRECISA_SENHA = /type=(invite|recovery)/.test(location.hash);
const sb = supabase.createClient(SUPABASE_URL, SUPABASE_KEY);
const TABELA = 'registros';

/* ===================== UTILIDADES ===================== */
const $ = s => document.querySelector(s);
const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const num = (v,d=2) => Number(v||0).toLocaleString('pt-BR',{minimumFractionDigits:d,maximumFractionDigits:d});
const brl = v => Number(v||0).toLocaleString('pt-BR',{style:'currency',currency:'BRL'});
const dataBR = d => d ? String(d).slice(0,10).split('-').reverse().join('/') : '';
const dtBR = d => d ? new Date(d).toLocaleString('pt-BR',{dateStyle:'short',timeStyle:'short'}) : '';
const hoje = () => { const d=new Date(); d.setMinutes(d.getMinutes()-d.getTimezoneOffset()); return d.toISOString().slice(0,10); };
const MESES = ['janeiro','fevereiro','março','abril','maio','junho','julho','agosto','setembro','outubro','novembro','dezembro'];
const mesBR = m => m ? MESES[+m.slice(5,7)-1]+' de '+m.slice(0,4) : '';
const soma = (l,f) => l.reduce((s,r)=>s+(+f(r)||0),0);
// Valor digitado no padrão brasileiro: "2.400,00", "2.400", "2400" ou "2400.5" → número
function numBR(v){
  let t = String(v ?? '').replace(/[R$\s]/g,'');
  if(!t) return '';
  if(t.includes(',')) t = t.replace(/\./g,'').replace(',','.');          // vírgula = decimal; pontos = milhar
  else if(/^\d{1,3}(\.\d{3})+$/.test(t)) t = t.replace(/\./g,'');     // "2.400" = dois mil e quatrocentos
  const n = parseFloat(t); return isNaN(n) ? '' : n;
}
const fmtBR = v => (v===''||v==null||isNaN(+v)) ? '' : Number(v).toLocaleString('pt-BR',{minimumFractionDigits:2,maximumFractionDigits:4});
const uid = () => (crypto.randomUUID ? crypto.randomUUID() : Date.now().toString(36)+Math.random().toString(36).slice(2,9));
function horasEntre(a,b){ if(!a||!b) return 0; const h=(new Date(b)-new Date(a))/36e5; return h>0?h:0; }
function hhmm(h){ const t=Math.round(h*60); return `${Math.floor(t/60)}h${String(t%60).padStart(2,'0')}`; }
function toast(msg){ const t=$('#toast'); t.textContent=msg; t.classList.add('on'); clearTimeout(t._t); t._t=setTimeout(()=>t.classList.remove('on'),2400); }
function carregando(on){ $('#carregando').classList.toggle('on', on); }
const tag = (txt, tipo='') => `<span class="tag ${tipo}">${esc(txt)}</span>`;
const kpi = (t,v,r='') => `<div class="kpi"><div class="r">${esc(t)}</div><div class="v">${v}</div><div class="r">${r}</div></div>`;
function tabelaBarras(titulos, pares, fmt=v=>num(v)){
  const max = Math.max(1, ...pares.map(p=>p[1]));
  const linhas = pares.map(([n,v,extra])=>`<tr><td>${esc(n)}</td><td class="num">${fmt(v)}</td>${extra!==undefined?`<td class="num">${extra}</td>`:''}<td style="width:35%"><div class="barra"><i style="width:${v/max*100}%"></i></div></td></tr>`);
  return `<table><thead><tr>${titulos.map((t,i)=>`<th class="${i?'num':''}">${t}</th>`).join('')}<th></th></tr></thead><tbody>${linhas.join('')||`<tr><td class="vazio" colspan="${titulos.length+1}">Sem dados no período.</td></tr>`}</tbody></table>`;
}
function agrupa(lista, chave, valor){ const g={}; lista.forEach(r=>{ const k=chave(r)||'—'; g[k]=(g[k]||0)+(+valor(r)||0); }); return Object.entries(g).sort((a,b)=>b[1]-a[1]); }

/* ===================== LISTAS DE OPÇÕES ===================== */
const OPT_COMB = ['Gasolina','Mistura 2T','Diesel S10','Diesel S500','Etanol','Elétrico','Não se aplica'];
const TIPOS_EQ = ['Roçadeira Costal','Trator','Prensa','Empilhadeira','Caminhão','Veículo leve','Gerador','Outro'];
const SIT_EQ = ['Operando','Em manutenção','Parado','Inativo'];
const TIPOS_OC = ['Falta','Falta justificada','Atestado','Atraso / saída antecipada','Hora extra 50%','Hora extra 100%','Férias','Afastamento','Folga / banco de horas'];
const AUSENCIAS = ['Falta','Falta justificada','Atestado','Atraso / saída antecipada','Doença','Acidente de trabalho','Outro'];
const MOTIVOS_AUS = ['Falta','Abonado','Falta justificada','Atraso / saída antecipada','Doença','Acidente de trabalho','Afastamento','Férias','Folga / banco de horas','Outro'];
const FUNCOES_PADRAO = ['Jardineiro operador','Líder de áreas verdes','Operador de roçadeira','Motorista de trator','Ajudante geral','Coletor','Técnico agrícola'];
const MATERIAIS_PADRAO = ['Papelão','Plástico','Filme stretch','Big bag','Papel misto','Sucata metálica','Outro'];
const TURNOS = ['1º turno','2º turno','3º turno','Administrativo'];

/* ===================== ESTADO ===================== */
let contratos = [];
let contrato = null;       // contrato aberto
let db = {};               // registros do contrato aberto, por coleção
const est = { mod:'geral', aba:0, mes:hoje().slice(0,7) };
const L = k => db[k] || [];
const ativoColab = r => r.ativo !== 'Inativo';
const ativoEquip = r => r.situacao !== 'Inativo';
const nomeColab = id => L('colaboradores').find(c=>c.id===id)?.nome || '—';
const equip = id => L('equipamentos').find(e=>e.id===id);
const nomeEquip = id => { const e=equip(id); return e ? e.codigo+(e.modelo?' – '+e.modelo:'') : '—'; };

// Ocorrências antigas tinham só "tipo": aqui viram situação/motivo/atestado.
function situacaoOc(r){
  if(r.situacao) return { situacao:r.situacao, motivo:r.motivo||'', atestado:r.atestado||'' };
  const t = r.tipo||'';
  if(t==='Presença') return { situacao:'Presença', motivo:'', atestado:'' };
  if(t.startsWith('Hora extra')) return { situacao:'Presença', motivo:'', atestado:'', he50: t==='Hora extra 50%'?r.horas:'', he100: t==='Hora extra 100%'?r.horas:'', horas:'' };
  return { situacao:'Ausência', motivo: t==='Atestado'?'Doença':t, atestado: t==='Atestado'?'Sim':'Não' };
}
const he50Oc = r => (+r.he50||0) + (r.tipo==='Hora extra 50%' ? (+r.horas||0) : 0);
const he100Oc = r => (+r.he100||0) + (r.tipo==='Hora extra 100%' ? (+r.horas||0) : 0);
const heOc = r => he50Oc(r) + he100Oc(r);

/* ===================== BANCO DE DADOS ===================== */
async function buscarTudo(filtro){
  const passo=1000; let de=0; const linhas=[];
  while(true){
    const { data, error } = await filtro(sb.from(TABELA).select('id,colecao,dados')).order('criado_em').range(de, de+passo-1);
    if(error) throw error;
    linhas.push(...data); if(data.length<passo) break; de+=passo;
  }
  return linhas.map(r=>Object.assign({}, r.dados, { id:r.id, _col:r.colecao }));
}
async function carregarContratos(){
  carregando(true);
  try{ contratos = (await buscarTudo(q=>q.eq('colecao','contratos'))).map(({_col,...r})=>r); }
  catch(e){ console.error(e); toast('Erro ao carregar contratos: '+(e.message||e)); }
  carregando(false);
}
async function carregarContrato(){
  carregando(true);
  try{
    const novo = {}; COLECOES_CONTRATO.forEach(c=>novo[c]=[]);
    (await buscarTudo(q=>q.eq('contrato_id', contrato.id))).forEach(({_col,...r})=>{ if(novo[_col]) novo[_col].push(r); });
    db = novo;
  }catch(e){ console.error(e); toast('Erro ao carregar dados: '+(e.message||e)); }
  carregando(false);
}
async function gravar(k, obj){
  const novo = !obj.id; if(novo) obj.id = uid();
  const { id, ...dados } = obj;
  carregando(true);
  const { error } = await sb.from(TABELA).upsert({ id, colecao:k, contrato_id: k==='contratos' ? null : contrato.id, dados, atualizado_em:new Date().toISOString() });
  carregando(false);
  if(error){ if(novo) obj.id=''; throw error; }
  const lista = k==='contratos' ? contratos : (db[k] = db[k] || []);
  const i = lista.findIndex(x=>x.id===id); if(i>-1) lista[i]=obj; else lista.push(obj);
  if(k==='contratos' && contrato?.id===id) contrato = obj;
}
async function excluir(k, id){
  if(k==='contratos'){
    const { count, error } = await sb.from(TABELA).select('id',{count:'exact',head:true}).eq('contrato_id',id);
    if(error){ alert(error.message); return; }
    if(count){ alert(`Este contrato tem ${count} registros. Para preservar o histórico, mude a situação para "Encerrado" em vez de excluir.`); return; }
  } else {
    const usos = COLECOES_CONTRATO.reduce((n,c)=>n+L(c).filter(r=>r.id!==id && Object.values(r).some(v=>v===id||(Array.isArray(v)&&v.includes(id)))).length,0);
    if(usos){ alert(`Este cadastro é usado em ${usos} lançamento(s). Marque-o como Inativo em vez de excluir.`); return; }
  }
  if(!confirm('Excluir este registro?')) return;
  carregando(true);
  const { error } = await sb.from(TABELA).delete().eq('id', id);
  carregando(false);
  if(error){ alert('Não foi possível excluir: '+error.message); return; }
  if(k==='contratos') contratos = contratos.filter(x=>x.id!==id); else db[k] = L(k).filter(x=>x.id!==id);
  toast('Excluído.'); renderTudo();
}

/* ===================== FORMULÁRIOS GENÉRICOS ===================== */
function opcoesRef(f){
  if(f.op) return f.op();
  return L(f.ent).filter(f.filtro||(()=>true)).sort(ENT[f.ent].ordem||(()=>0)).map(r=>[r.id, ENT[f.ent].titulo(r)]);
}
function campoHTML(k, f){
  const req = f.req ? ' required' : '', rot = esc(f.l)+(f.req?' *':'');
  switch(f.t){
    case 'multi': {
      const ops = opcoesRef(f);
      return `<label class="largo">${rot}<div class="checks" data-multi="${f.k}">${ops.map(([v,t])=>`<label><input type="checkbox" value="${esc(v)}"> ${esc(t)}</label>`).join('') || '<span class="info" style="margin:0">Nenhum cadastro ativo.</span>'}</div></label>`;
    }
    case 'textarea': return `<label class="largo">${rot}<textarea name="${f.k}" rows="2"></textarea></label>`;
    case 'select': return `<label>${rot}<select name="${f.k}"${req}>${f.vazio?'<option value="">Selecione…</option>':''}${f.op.map(o=>`<option>${esc(o)}</option>`).join('')}</select></label>`;
    case 'opcoes': return `<div class="lbl">${rot}<div class="opcoes" data-opcoes="${f.k}">${f.op.map(o=>{ const [v,t]=Array.isArray(o)?o:[o,o]; return `<label class="chk"><input type="checkbox" name="${f.k}" value="${esc(v)}"> ${esc(t)}</label>`; }).join('')}</div></div>`;
    case 'ref': {
      const ops = opcoesRef(f);
      return `<label>${rot}<select name="${f.k}"${req}><option value="">${ops.length?'Selecione…':'Nada cadastrado em Cadastros'}</option>${ops.map(([v,t])=>`<option value="${esc(v)}">${esc(t)}</option>`).join('')}</select></label>`;
    }
    case 'list': return `<label>${rot}<input name="${f.k}" list="dl_${k}_${f.k}"${req} autocomplete="off"><datalist id="dl_${k}_${f.k}">${f.op().map(o=>`<option value="${esc(o)}">`).join('')}</datalist></label>`;
    case 'number': return `<label>${rot}<input type="number" name="${f.k}" step="${f.step||'0.01'}" min="0"${req}></label>`;
    case 'date': return `<label>${rot}<input type="date" name="${f.k}"${req}></label>`;
    case 'time': return `<label>${rot}<input type="time" name="${f.k}"${req}></label>`;
    case 'moeda': return `<label>${rot}<input type="text" inputmode="decimal" name="${f.k}" placeholder="0,00" data-moeda="1" autocomplete="off"${req}></label>`;
    case 'datetime': return `<label>${rot}<input type="datetime-local" name="${f.k}"${req}></label>`;
    default: return `<label>${rot}<input type="text" name="${f.k}"${req}></label>`;
  }
}
function campoComMarca(k, f){ return campoHTML(k, f).replace(/^<(label|div)/, `<$1 data-campo="${f.k}"`); }
function valoresForm(f){ return Object.fromEntries(new FormData(f).entries()); }
function atualizarVisiveis(k){
  const f = $('#form_'+k), E = ENT[k]; if(!f) return;
  const o = valoresForm(f);
  E.campos.forEach(c=>{ if(!c.se) return; const w = f.querySelector(`[data-campo="${c.k}"]`); if(w) w.hidden = !c.se(o); });
}
function formHTML(k){
  const E = ENT[k], largos = f => ['multi','textarea'].includes(f.t);
  return `<form id="form_${k}" data-ent="${k}"><input type="hidden" name="id">
    <div class="grid">${E.campos.filter(f=>!largos(f)).map(f=>campoComMarca(k,f)).join('')}</div>
    ${E.campos.filter(largos).map(f=>campoComMarca(k,f)).join('')}
    ${E.extra?`<div class="info" id="extra_${k}"></div>`:''}
    <div class="linha-botoes"><button class="pri" type="submit">Salvar</button><button type="button" data-limpar="${k}">Limpar / novo</button></div></form>`;
}
function prepararForm(k){
  const f = $('#form_'+k); if(!f) return;
  const E = ENT[k];
  f.addEventListener('submit', async e=>{
    e.preventDefault();
    let o = valoresForm(f);
    f.querySelectorAll('[data-multi]').forEach(m=>{ o[m.dataset.multi] = [...m.querySelectorAll('input:checked')].map(i=>i.value); });
    E.campos.forEach(c=>{ if(c.se && !c.se(o)) delete o[c.k]; });
    const msg = E.validar?.(o); if(msg){ alert(msg); return; }
    E.campos.filter(c=>c.t==='moeda').forEach(c=>{ if(o[c.k]!==undefined) o[c.k] = o[c.k]==='' ? '' : String(numBR(o[c.k])); });
    if(E.antesSalvar) o = E.antesSalvar(o);
    if(k!=='contratos' && !o.id) o.criadoPor = $('#usuarioEmail').textContent;
    try{ await gravar(k, o); }catch(err){ alert('Não foi possível salvar: '+(err.message||err)); return; }
    toast('Salvo!'); renderTudo();
  });
  if(E.extra){ const up=()=>$('#extra_'+k).textContent=E.extra(f); f.addEventListener('input',up); f.addEventListener('change',up); }
  f.querySelectorAll('[data-moeda]').forEach(i=>i.addEventListener('blur', ()=>{ const n = numBR(i.value); if(n!=='') i.value = fmtBR(n); }));
  f.addEventListener('change', e=>{
    const op = e.target.closest('[data-opcoes]');
    if(op && e.target.checked) op.querySelectorAll('input').forEach(i=>{ if(i!==e.target) i.checked=false; });   // escolha única
    atualizarVisiveis(k); E.aoMudar?.(f, valoresForm(f));
  });
  if(k==='ordens') f.querySelector('[data-multi="colabs"]').addEventListener('change',()=>{ const n=f.querySelectorAll('[data-multi="colabs"] input:checked').length; if(n){ f.qtdColab.value=n; $('#extra_ordens').textContent=E.extra(f);} });
  if(k==='abastecimentos') f.equipId.addEventListener('change',()=>{ const e=equip(f.equipId.value); if(e?.combustivel) f.combustivel.value=e.combustivel; });
  limparForm(k);
}
function limparForm(k){
  const f = $('#form_'+k); if(!f) return; const E = ENT[k];
  f.reset(); f.elements.id.value='';
  E.campos.forEach(c=>{
    const el = f.elements[c.k];
    if(c.t==='date' && !c.semDef && el) el.value = hoje();
    if(c.def!==undefined && el) el.value = c.def;
    if(c.t==='multi') f.querySelectorAll(`[data-multi="${c.k}"] input`).forEach(i=>i.checked=!!c.defTodos);
  });
  const h = f.closest('.card')?.querySelector('h2'); if(h) h.textContent = 'Novo: '+E.nome;
  if(E.extra) $('#extra_'+k).textContent = E.extra(f);
  atualizarVisiveis(k);
}
function editarForm(k, id){
  const lista = k==='contratos' ? contratos : L(k), bruto = lista.find(x=>x.id===id); if(!bruto) return;
  if(k==='contratos') $('#novoContrato').open = true;
  const f = $('#form_'+k), E = ENT[k], o = E.paraForm ? { ...bruto, ...E.paraForm(bruto) } : bruto;
  limparForm(k);
  f.elements.id.value = o.id;
  E.campos.forEach(c=>{
    if(c.t==='multi'){ f.querySelectorAll(`[data-multi="${c.k}"] input`).forEach(i=>i.checked=(o[c.k]||[]).includes(i.value)); return; }
    if(c.t==='opcoes'){ f.querySelectorAll(`[data-opcoes="${c.k}"] input`).forEach(i=>i.checked=i.value===o[c.k]); return; }
    const el = f.elements[c.k]; if(!el) return;
    const v = o[c.k] ?? '';
    if(el.tagName==='SELECT' && v && ![...el.options].some(op=>op.value===v)){ const op=document.createElement('option'); op.value=v; op.textContent=c.t==='ref'?(ENT[c.ent].titulo(L(c.ent).find(r=>r.id===v)||{codigo:v,nome:v,tipo:''})+' (inativo)'):v; el.appendChild(op); }
    el.value = c.t==='moeda' ? fmtBR(v) : v;
  });
  atualizarVisiveis(k);
  const h = f.closest('.card')?.querySelector('h2'); if(h) h.textContent = 'Editando: '+E.nome;
  if(E.extra) $('#extra_'+k).textContent = E.extra(f);
  f.scrollIntoView({behavior:'smooth', block:'start'});
}

function resumoRH(){
  const ativos = L('colaboradores').filter(ativoColab), previsto = soma(L('quadro'),q=>q.previsto);

/* ===================== RH – FREQUÊNCIA (módulo Combustível) ===================== */
const STATUS_FREQ = ['Presente','Falta','Falta justificada','Atestado','Afastamento','Férias','Folga','Feriado'];
const COM_CID = ['Atestado','Afastamento'];
const DIAS_SEMANA = ['domingo','segunda-feira','terça-feira','quarta-feira','quinta-feira','sexta-feira','sábado'];
// Horário de trabalho do cadastro: seg–qui e sexta (entrada, saída, intervalo). Sábado, domingo e feriado = hora extra.
function horasDoHorario(e, s, intervalo){
  if(!e || !s) return 0;
  const [eh,em] = e.split(':').map(Number), [sh,sm] = s.split(':').map(Number);
  let t = (sh*60+sm) - (eh*60+em); if(t < 0) t += 1440;          // horário que vira a meia-noite
  return Math.max(0, (t - (+intervalo||0)) / 60);
}
const hSegQui = c => horasDoHorario(c?.sqEntrada, c?.sqSaida, c?.sqIntervalo);
const hSex = c => horasDoHorario(c?.sxEntrada, c?.sxSaida, c?.sxIntervalo);
const temHorario = c => hSegQui(c) > 0 && hSex(c) > 0;
const textoHorario = c => temHorario(c) ? `Seg–Qui ${c.sqEntrada}–${c.sqSaida} · Sex ${c.sxEntrada}–${c.sxSaida}` : '—';
const jDia = c => temHorario(c) ? hSegQui(c) : (+c?.horasDia || jornada());
const jSem = c => temHorario(c) ? 4*hSegQui(c) + hSex(c) : (+c?.horasSemana || jornadaSemana());
const vHora = c => +c?.salario ? +c.salario / (jSem(c)*5) : (+c?.valorHora || 0);   // salário ÷ divisor (44 h/sem → 220)
const pctHE = () => (contrato?.adicionalHE===undefined || contrato?.adicionalHE==='') ? 50 : +contrato.adicionalHE;
const minutos = t => { if(!t) return null; const [h,m] = String(t).split(':').map(Number); return isNaN(h) ? null : h*60+(m||0); };
const addDias = (d, n) => { const x = new Date(d+'T12:00:00'); x.setDate(x.getDate()+n); return x.toISOString().slice(0,10); };
const diaSemana = d => DIAS_SEMANA[new Date(d+'T12:00:00').getDay()];
const freqId = (colabId, data) => `freq_${colabId}_${data}`;
const registroFreq = (colabId, data) => L('frequencia').find(r=>r.colabId===colabId && r.data===data);
let freqAlterada = false;
if(!est.dataFreq) est.dataFreq = hoje();

// Horas trabalhadas e horas extras de um dia. Sem entrada/saída, presença conta a jornada do dia.
function calcFreq(r, hd){
  if(r.status!=='Presente') return { horas:0, he:0 };
  const e = minutos(r.entrada), s = minutos(r.saida);
  if(e===null || s===null) return { horas:hd, he:0 };
  let t = s - e; if(t < 0) t += 1440;               // virada da meia-noite
  t -= (+r.intervalo || 0);
  const horas = Math.max(0, t/60);
  return { horas, he: Math.max(0, horas - hd) };
}
// Atestado/afastamento lançado antes e que ainda cobre a data (pelo número de dias informado).
function cobertura(colabId, data){
  return L('frequencia').filter(r=>r.colabId===colabId && COM_CID.includes(r.status) && +r.dias>1 && r.data<data && addDias(r.data, +r.dias)>data)
    .sort((a,b)=>b.data.localeCompare(a.data))[0];
}
function semanaDe(data){ const d = new Date(data+'T12:00:00'), dow = (d.getDay()+6)%7; const seg = addDias(data, -dow); return [seg, addDias(seg, 6)]; }
function horasSemanaOutrosDias(colabId, data){
  const [ini, fim] = semanaDe(data);
  return soma(L('frequencia').filter(r=>r.colabId===colabId && r.data>=ini && r.data<=fim && r.data!==data), r=>r.horas);
}

    const opt = ['<option value="">— não lançado —</option>', ...STATUS_FREQ.map(s=>`<option ${r.status===s?'selected':''}>${s}</option>`)].join('');
    return `<tr data-c="${c.id}" class="${prev?'alterada':''}">

    CID e dias só valem para atestado e afastamento; nos dias seguintes, o colaborador já aparece como em atestado/afastamento até o retorno (marcado em laranja) e é só salvar o dia.
    A coluna Semana soma segunda a domingo e fica em destaque quando passa da jornada semanal.</p></div>`;

function linhaFreq(tr){
  const g = n => tr.querySelector(`[name=${n}]`), st = g('status').value, hd = +g('hd').value || jornada(), hs = +g('hs').value || jornadaSemana();
  const pres = st==='Presente', cid = COM_CID.includes(st);
  ['entrada','saida','intervalo'].forEach(n=>g(n).disabled = !pres);
  ['cid','dias'].forEach(n=>g(n).disabled = !cid);
  const r = { status:st, entrada:g('entrada').value, saida:g('saida').value, intervalo:g('intervalo').value };
  const { horas, he } = calcFreq(r, hd);
  const o = n => tr.querySelector(`[data-o=${n}]`);
  o('horas').textContent = pres ? hhmm(horas) : '';
  o('he').innerHTML = he>0 ? tag(hhmm(he),'w') : '';
  o('retorno').textContent = cid && +g('dias').value ? dataBR(addDias(est.dataFreq, +g('dias').value)) : '';
  const sem = horasSemanaOutrosDias(tr.dataset.c, est.dataFreq) + horas;
  o('semana').innerHTML = sem > hs ? tag(num(sem,1)+' / '+num(hs,0),'w') : num(sem,1)+' / '+num(hs,0);
  return { ...r, horas, he, hd, hs, cid:g('cid').value.trim().toUpperCase(), dias:g('dias').value, obs:g('obs').value.trim() };
}

async function salvarFrequencia(){
  const d = est.dataFreq, regs = [], apagar = [], colabsAlt = [];
  document.querySelectorAll('table.freq tbody tr').forEach(tr=>{
    const c = L('colaboradores').find(x=>x.id===tr.dataset.c), v = linhaFreq(tr), id = freqId(c.id, d);

      const o = { id, colabId:c.id, data:d, status:v.status, horas:+v.horas.toFixed(4), he:+v.he.toFixed(4), obs:v.obs };
      if(v.status==='Presente'){ o.entrada=v.entrada; o.saida=v.saida; o.intervalo=v.intervalo; }
      if(COM_CID.includes(v.status)){ o.cid=v.cid; o.dias=v.dias; }
      regs.push(o);
    } else if(registroFreq(c.id, d)) apagar.push(id);
    if(String(v.hd)!==String(jDia(c)) || String(v.hs)!==String(jSem(c))) colabsAlt.push({ ...c, horasDia:String(v.hd), horasSemana:String(v.hs) });
  });
  if(await gravarFrequencias(regs, apagar, colabsAlt)) toast(`Dia ${dataBR(d)} salvo: ${regs.length} colaborador(es).`);
}

const STATUS_COD = Object.fromEntries(Object.entries(COD_FREQ).map(([s,c])=>[c,s]));

async function salvarGrade(){
  const regs = [], apagar = [];
  document.querySelectorAll('table.grade select.cel').forEach(s=>{
    if(!s.dataset.mudou && !s.dataset.prev) return;
    const colabId = s.closest('tr').dataset.c, d = s.dataset.d, c = L('colaboradores').find(x=>x.id===colabId), ex = registroFreq(colabId, d);
    if(!s.value){ if(ex) apagar.push(ex.id); return; }
    const status = STATUS_COD[s.value], o = ex ? { ...ex, status } : { id:freqId(colabId, d), colabId, data:d, status, obs:'' };
    if(status==='Presente'){ if(!ex || ex.status!=='Presente'){ o.horas = jDia(c); o.he = 0; delete o.entrada; delete o.saida; } }
    else { o.horas = 0; o.he = 0; delete o.entrada; delete o.saida; delete o.intervalo; }
    if(!COM_CID.includes(status)){ delete o.cid; delete o.dias; }
    else if(!ex){ const cob = cobertura(colabId, d); if(cob && cob.status===status){ o.cid = cob.cid; o.obs = `Continuação (${status.toLowerCase()} de ${dataBR(cob.data)})`; } }

  });

}
async function gravarFrequencias(regs, apagar, colabsAlt){
  carregando(true);
  try{
    const linhas = [...regs.map(o=>({ k:'frequencia', o })), ...colabsAlt.map(o=>({ k:'colaboradores', o }))]
      .map(({k,o})=>{ const { id, ...dados } = o; return { id, colecao:k, contrato_id:contrato.id, dados, atualizado_em:new Date().toISOString() }; });
    if(linhas.length){ const { error } = await sb.from(TABELA).upsert(linhas); if(error) throw error; }
    if(apagar.length){ const { error } = await sb.from(TABELA).delete().in('id', apagar); if(error) throw error; }
  }catch(e){ carregando(false); alert('Não foi possível salvar: '+(e.message||e)); return false; }
  carregando(false);

/* ---------- Impostos e encargos da folha (tabelas 2026) ----------
   INSS empregado 2026: progressivo 7,5% / 9% / 12% / 14%, teto R$ 8.475,55 (desconto máximo R$ 988,09).
   IRRF 2026 (Lei 15.270/2025): tabela mensal + redução: até R$ 5.000,00 de rendimento tributável zera o imposto
   (redução até R$ 312,89); de R$ 5.000,01 a R$ 7.350,00 redução = 978,62 − 0,133145 × rendimento; acima, sem redução.
   Dedução por dependente R$ 189,59 ou desconto simplificado R$ 607,20 (usa o mais vantajoso). */
const INSS_FAIXAS = [[1621.00, 0.075], [2902.84, 0.09], [4354.27, 0.12], [8475.55, 0.14]];
const IR_FAIXAS = [[2428.80, 0, 0], [2826.65, 0.075, 182.16], [3751.05, 0.15, 394.16], [4664.68, 0.225, 675.49], [Infinity, 0.275, 908.73]];
const IR_DEPENDENTE = 189.59, IR_SIMPLIFICADO = 607.20;
const r2 = v => Math.round(+(v * 100).toFixed(6)) / 100;   // arredondamento comercial (121,575 → 121,58)
function inssEmpregado(base){
  let ant = 0, total = 0;
  for(const [lim, al] of INSS_FAIXAS){ if(base > ant) total += (Math.min(base, lim) - ant) * al; ant = lim; }   // arredonda só o total
  return r2(total);
}
function irrfMensal(bruto, inss, dependentes){
  const baseLegal = bruto - inss - (dependentes||0) * IR_DEPENDENTE, baseSimpl = bruto - IR_SIMPLIFICADO;
  const simplificado = baseSimpl < baseLegal, base = Math.max(0, simplificado ? baseSimpl : baseLegal);
  const [, al, ded] = IR_FAIXAS.find(([lim]) => base <= lim);
  const imposto = Math.max(0, r2(base * al - ded));
  const reducao = bruto <= 5000 ? Math.min(imposto, 312.89) : bruto <= 7350 ? Math.min(imposto, Math.max(0, r2(978.62 - 0.133145 * bruto))) : 0;
  return { base: r2(base), simplificado, aliquota: al, imposto, reducao: r2(reducao), irrf: r2(Math.max(0, imposto - reducao)) };
}
const cfg = (k, padrao) => (contrato?.[k]===undefined || contrato?.[k]==='') ? padrao : +contrato[k];
function encargosEmpresa(base){
  const regime = contrato?.regime || 'Lucro Real / Presumido';
  const simples = regime.startsWith('Simples'), anexo4 = regime.includes('IV');
  const pPatronal = simples && !anexo4 ? 0 : 20, pRat = simples && !anexo4 ? 0 : cfg('ratPct', 3) * cfg('fap', 1), pTerc = simples ? 0 : cfg('terceirosPct', 5.8), pFgts = cfg('fgtsPct', 8);
  const v = p => r2(base * p / 100);
  return { regime, pPatronal, pRat, pTerc, pFgts, patronal:v(pPatronal), rat:v(pRat), terceiros:v(pTerc), fgts:v(pFgts), pTotal:pPatronal+pRat+pTerc+pFgts, total:v(pPatronal)+v(pRat)+v(pTerc)+v(pFgts) };
}
/* ---------- RH: ocorrências em formato de calendário (um colaborador por vez) ---------- */
/* Regras de cálculo (CLT / prática de DP):

   - Seg a sex: o que passar da jornada diária = HE com o adicional normal (50%).
   - Sábado: jornada do sábado = jornada semanal − 5 × jornada diária (44 − 5×8 = 4h; 44 − 5×8,8 = 0).
     O que passar dela = HE 50%.
   - Domingo e feriado trabalhados: todas as horas = HE com adicional de 100%.
   - DSR sobre HE = (valor total das HE ÷ dias úteis do mês) × (domingos + feriados do mês).
   - Falta injustificada: desconta o dia (salário ÷ 30) e o DSR da semana (mais 1 dia por semana com falta).
   - Atestado, falta justificada, férias, folga e afastamento: não descontam.

  const t = tipoDia(d);
  if(temHorario(c)){ if(t!=='util') return 0; return new Date(d+'T12:00:00').getDay()===5 ? hSex(c) : hSegQui(c); }   // sábado, domingo e feriado: tudo é HE
  return t==='util' ? jDia(c) : t==='sab' && !sabadoFolga() ? Math.max(0, +(jSem(c) - 5*jDia(c)).toFixed(2)) : 0;

function calcDia(c, d, htInformado){
  const dow = new Date(d+'T12:00:00').getDay(), padrao = temHorario(c) && dow===5 ? hSex(c) : jDia(c);   // campo vazio: horário daquele dia da semana

// Aceita 5 | 5,5 | 5.5 | 5:30 | 5h30 → horas decimais ('' se vazio/ inválido)
function horasTxt(t){
  t = String(t||'').trim().toLowerCase().replace('h',':').replace(/:$/,''); if(!t) return '';
  if(t.includes(':')){ const [h,m] = t.split(':'); const v = (+h||0) + (+m||0)/60; return v>0 && v<=24 ? String(+v.toFixed(4)) : ''; }
  const v = +t.replace(',','.'); return v>0 && v<=24 ? String(v) : '';
}
// Duração da HE: fim − início − intervalo (passa da meia-noite se fim < início)
function duracaoHE(ini, fim, intervalo){
  if(!ini || !fim) return 0;
  const m = t => { const [h,mi] = t.split(':').map(Number); return h*60 + (mi||0); };
  let min = m(fim) - m(ini); if(min <= 0) min += 1440;
  const iv = String(intervalo||'').trim() ? Math.round((+horasTxt(intervalo)||0)*60) : 0;
  return Math.max(0, min - iv) / 60;
}

      acH += r.h; acHE += r.he50 + r.he100; h50 += r.he50; h100 += r.he100; hNao += r.naoTrab; acR += vHE;
      o.innerHTML = [dv.classList.contains('abonavel') && !v.durHE && !v.htInf ? '<b class="neg">Informe início e fim da HE (vazio = dia inteiro)</b>' : '', r.he50>0?`<b class="he">HE 50% +${hhmm(r.he50)}</b>`:'', r.he100>0?`<b class="he">HE 100% +${hhmm(r.he100)}</b>`:'', r.naoTrab>0?`<b class="neg">−${hhmm(r.naoTrab)} não trab.</b>`:'',
        `Mês: ${hhmm(acH)}${acHE>0?` · HE ${hhmm(acHE)}`:''}`, vh && vHE ? `<b class="rs">HE ${brl(vHE)}</b> · mês ${brl(acR)}` : ''].filter(Boolean).join('<br>');
    } else {
      o.innerHTML = '';
      if(v.A && diaAbonado(d)){ o.innerHTML = 'Dia abonado: ausência não desconta'; }
      else if(v.A && !v.AT && v.motivo==='Falta'){ faltas++; semanasFalta.add(semanaDe(d)[0]); o.innerHTML = '<b class="neg">Desconta dia + DSR</b>'; }
    }
    return v;
  });
  // DSR: dias úteis x domingos/feriados do mês
  const datas = dvs.map(dv=>dv.dataset.d), domFer = datas.filter(d=>['dom','fer'].includes(tipoDia(d))).length, uteis = datas.length - domFer;
  const vHE50 = h50*vh*f50, vHE100 = h100*vh*f100, dsrHE = uteis ? (vHE50+vHE100)/uteis*domFer : 0;
  const vDia = sal/30, descFaltas = faltas*vDia, descDSR = semanasFalta.size*vDia, descHoras = hNao*vh;

  $('#calResumo').innerHTML = kpi('Presenças', vs.filter(v=>v.P).length) + kpi('Ausências', vs.filter(v=>v.A).length, faltas+' faltas sem atestado')
    + kpi('Com atestado', vs.filter(v=>v.AT).length) + kpi('Dias abonados', abonados, `folgas${domFer?' e feriados':''} sem trabalho${abonadosMotivo?` + ${abonadosMotivo} abono(s)`:''}`) + kpi('Horas trabalhadas no mês', hhmm(acH), hNao?`${hhmm(hNao)} abaixo da jornada`:'')
    + kpi('Horas extras no mês', hhmm(acHE), `50%: ${hhmm(h50)} · 100%: ${hhmm(h100)}`);
  if(!sal){ $('#calValores').innerHTML = `<div class="card"><p style="margin:0">Informe o <b>salário mensal</b> no quadro verde acima para ver o cálculo financeiro (horas extras, DSR e descontos).</p></div>`; return; }
  const lin = (desc, ref, val, cls='') => `<tr class="${cls}"><td>${desc}</td><td class="num">${ref}</td><td class="num">${val}</td></tr>`;
  const avisoSal = sal < 500 ? `<p class="alerta">⚠️ O salário está como <b>${brl(sal)}</b>, o que parece incorreto. Digite o valor completo no quadro verde (ex.: <b>2.400,00</b>) e clique em <b>Salvar mês</b>.</p>` : '';
  const bruto = r2(proventos - descontos), deps = +c.dependentes || 0;
  const inss = inssEmpregado(bruto), ir = irrfMensal(bruto, inss, deps), liquido = r2(bruto - inss - ir.irrf);
  const enc = encargosEmpresa(bruto);
  const prov13 = r2(bruto/12), provFer = r2(bruto/12*4/3), encProv = r2((prov13+provFer) * enc.pTotal/100);
  const custo = r2(bruto + enc.total + prov13 + provFer + encProv);
  const menos = v => v ? '−'+brl(v) : brl(0), pct = v => num(v, v%1?2:0)+'%';
  $('#calValores').innerHTML = `<div class="card holerite"><div class="filtros"><h2 style="margin:0">Demonstrativo do mês – ${esc(c.nome)}</h2><span style="flex:1"></span><span class="info" style="margin:0">Valor da hora ${brl(vh)} · dia ${brl(vDia)} · ${deps} dependente(s) para IR</span></div>${avisoSal}
    <div class="tabela-wrap"><table><thead><tr><th>Descrição</th><th class="num">Referência</th><th class="num">Valor</th></tr></thead><tbody>
      <tr class="secao"><td colspan="3">1. Proventos</td></tr>
      ${lin('Salário base','30 dias',brl(sal))}
      ${lin('Folgas semanais e feriados abonados (remunerados)', `${abonados} dia(s)`, 'incluso no salário')}
      ${lin(`Horas extras ${num(pctHE(),0)}% (dias úteis e sábados)`, hhmm(h50), brl(vHE50))}
      ${lin(`Horas extras ${num(pctHE100(),0)}% (domingos e feriados)`, hhmm(h100), brl(vHE100))}
      ${lin('DSR sobre horas extras', `${uteis} úteis / ${domFer} dom.+fer.`, brl(dsrHE))}
      ${lin('(−) Faltas injustificadas', `${faltas} dia(s)`, menos(descFaltas), 'neg')}

      ${lin('(−) Horas não trabalhadas (atrasos/saídas)', hhmm(hNao), menos(descHoras), 'neg')}
      ${lin('<b>Salário bruto</b>','base de INSS, IRRF e FGTS',`<b>${brl(bruto)}</b>`,'sub')}
      <tr class="secao"><td colspan="3">2. Descontos do colaborador</td></tr>
      ${lin('(−) INSS (tabela progressiva 2026)', bruto ? pct(inss/bruto*100)+' efetiva' : '', menos(inss), 'neg')}
      ${lin(`(−) IRRF${ir.reducao?' (com redução da Lei 15.270/2025)':''}`, ir.irrf || ir.imposto ? `base ${brl(ir.base)} · ${pct(ir.aliquota*100)}${ir.simplificado?' · desc. simplificado':''}${ir.reducao?` · redução ${brl(ir.reducao)}`:''}` : 'isento', menos(ir.irrf), 'neg')}
      ${lin('<b>Salário líquido a receber</b>','',`<b style="color:var(--pri);font-size:16px">${brl(liquido)}</b>`,'total')}
      <tr class="secao"><td colspan="3">3. Encargos da empresa <span class="info" style="font-weight:400">(${esc(enc.regime)})</span></td></tr>
      ${lin('INSS patronal (CPP)', pct(enc.pPatronal), brl(enc.patronal))}
      ${lin('RAT/SAT × FAP', pct(enc.pRat), brl(enc.rat))}
      ${lin('Terceiros (Sistema S, salário-educação)', pct(enc.pTerc), brl(enc.terceiros))}
      ${lin('FGTS', pct(enc.pFgts), brl(enc.fgts))}
      ${lin('<b>Total de encargos sobre a folha</b>', pct(enc.pTotal), `<b>${brl(enc.total)}</b>`, 'sub')}
      <tr class="secao"><td colspan="3">4. Provisões mensais</td></tr>
      ${lin('13º salário', '1/12', brl(prov13))}
      ${lin('Férias + 1/3', '1/12 + 1/3', brl(provFer))}

      ${lin('<b>Custo total do colaborador no mês</b>', bruto ? `${num(custo/bruto,2)}× o salário bruto` : '', `<b style="font-size:16px">${brl(custo)}</b>`, 'total')}
    </tbody></table></div>
    <p class="info">Tabelas de 2026: INSS progressivo (7,5% a 14%, teto R$ 8.475,55) e IRRF com a isenção até R$ 5.000 da Lei 15.270/2025 (dependente R$ 189,59 ou desconto simplificado de R$ 607,20, o que for melhor).
      Regime tributário, RAT, FAP e Terceiros ficam no cadastro do contrato. Não inclui adicional noturno, insalubridade/periculosidade, vale-transporte, pensão, benefícios nem regras da convenção coletiva.
      Atestado, falta justificada, férias, folga e afastamento não descontam (afastamento acima de 15 dias passa ao INSS). Valores estimados: confira com a contabilidade antes de pagar.</p></div>`;
}
function prepCalendarioRH(){
  freqAlterada = false;
  prepararForm('ocorrencias');
  const cal = document.querySelector('.cal'); if(!cal) return;
  resumoCal();
  cal.addEventListener('change', e=>{
    const dv = e.target.closest('.d'); if(!dv) return;
    const k = e.target.dataset.k;
    if(k==='pres' && e.target.checked) dv.querySelector('[data-k=aus]').checked = false;   // presença e ausência se excluem
    if(k==='pres' && e.target.checked && dv.classList.contains('abonavel')) setTimeout(()=>dv.querySelector('[data-k=hei]').focus(), 0);
    if(k==='aus' && e.target.checked) dv.querySelector('[data-k=pres]').checked = false;
    dv.classList.add('mudou'); dv.dataset.mudou = '1'; freqAlterada = true; resumoCal();
  });
  $('#calSal').addEventListener('input', ()=>{ freqAlterada = true; resumoCal(); });
  $('#calSal').addEventListener('blur', e=>{ const n = numBR(e.target.value); if(n!=='') e.target.value = fmtBR(n); });
  cal.addEventListener('input', e=>{ if(!['ht','hei','hef','hint'].includes(e.target.dataset.k)) return; const dv=e.target.closest('.d'); dv.classList.add('mudou'); dv.dataset.mudou='1'; freqAlterada=true; resumoCal(); });
  const trocar = id => { if(freqAlterada && !confirm('Há alterações não salvas neste calendário. Trocar sem salvar?')){ $('#calColab').value = est.calColab; return; } freqAlterada=false; est.calColab = id; renderTudo(); };
  $('#calColab').addEventListener('change', e=>trocar(e.target.value));
  const ops = [...$('#calColab').options].map(o=>o.value), pos = ops.indexOf(est.calColab);
  $('#calAnt').addEventListener('click', ()=>trocar(ops[(pos-1+ops.length)%ops.length]));
  $('#calProx').addEventListener('click', ()=>trocar(ops[(pos+1)%ops.length]));
  $('#calUteis').addEventListener('click', ()=>{
    const c = L('colaboradores').find(x=>x.id===est.calColab);
    cal.querySelectorAll('.d[data-d]').forEach(dv=>{ const d=dv.dataset.d;
      if(d<=hoje() && jornadaDoDia(c, d)>0 && !dv.querySelector('[data-k=pres]').checked && !dv.querySelector('[data-k=aus]').checked){
        dv.querySelector('[data-k=pres]').checked = true; dv.classList.add('mudou'); dv.dataset.mudou='1'; freqAlterada = true; } });
    resumoCal();
  });
  $('#calSalvar').addEventListener('click', salvarCalendarioRH);
}
async function salvarCalendarioRH(){
  const cid = est.calColab, colab = L('colaboradores').find(x=>x.id===cid), regs = [], apagar = [];
  document.querySelectorAll('.cal .d[data-mudou]').forEach(dv=>{
    const d = dv.dataset.d, v = celulaCal(dv), ex = ocDoDia(cid, d);
    if(!v.P && !v.A){ if(ex) apagar.push(ex.id); return; }
    const o = { ...(ex || { id:`oc_${cid}_${d}`, colabId:cid, data:d, obs:'', criadoPor:$('#usuarioEmail').textContent }) };
    ['motivo','atestado','cid','he50','he100','horasTrab','horasNaoTrab','heIni','heFim','heInt','htInf'].forEach(k=>delete o[k]);
    if(v.P){ const r = calcDia(colab, d, v.ht);
      Object.assign(o, { situacao:'Presença', tipo:'Presença', horasTrab:String(r.h), he50:String(+r.he50.toFixed(2)), he100:String(+r.he100.toFixed(2)), horasNaoTrab:String(+r.naoTrab.toFixed(2)) }); delete o.dias; delete o.horas;
      if(v.heIni || v.heFim) Object.assign(o, { heIni:v.heIni, heFim:v.heFim, heInt:v.heInt, htInf:v.htInf }); }
    else Object.assign(o, { situacao:'Ausência', motivo:v.motivo, atestado:v.AT?'Sim':'Não', cid:v.AT?v.cid:'', dias:(ex && situacaoOc(ex).situacao==='Ausência' && ex.dias) || '1', tipo:v.AT?'Atestado':v.motivo });
    regs.push(o);
  });
  const salNovo = numBR($('#calSal').value), salMudou = salNovo!=='' && Math.abs(+salNovo - salarioBase(colab)) > 0.004;
  const colabAlt = salMudou ? (({ valorHora, ...resto }) => ({ ...resto, salario:String(salNovo) }))(colab) : null;
  if(!regs.length && !apagar.length && !colabAlt){ toast('Nada para salvar.'); return; }
  carregando(true);
  try{
    const linhas = regs.map(({id,...dados})=>({ id, colecao:'ocorrencias', contrato_id:contrato.id, dados, atualizado_em:new Date().toISOString() }));
    if(colabAlt){ const { id, ...dados } = colabAlt; linhas.push({ id, colecao:'colaboradores', contrato_id:contrato.id, dados, atualizado_em:new Date().toISOString() }); }
    if(linhas.length){ const { error } = await sb.from(TABELA).upsert(linhas); if(error) throw error; }
    if(apagar.length){ const { error } = await sb.from(TABELA).delete().in('id', apagar); if(error) throw error; }
  }catch(e){ carregando(false); alert('Não foi possível salvar: '+(e.message||e)); return; }
  carregando(false);
  const ids = new Set([...regs.map(r=>r.id), ...apagar]);
  db.ocorrencias = L('ocorrencias').filter(r=>!ids.has(r.id)).concat(regs);
  if(colabAlt){ const i = db.colaboradores.findIndex(x=>x.id===cid); if(i>-1) db.colaboradores[i] = colabAlt; }
  freqAlterada = false; toast(`Calendário salvo: ${regs.length} dia(s)${apagar.length?`, ${apagar.length} removido(s)`:''}.`); renderTudo();
}

function baixar(nome, conteudo, tipo){

function exportarCSV(k){
  const E = ENT[k], l = listaEnt(k), txt = h => String(h).replace(/<[^>]+>/g,'').replace(/&amp;/g,'&').replace(/&lt;/g,'<').replace(/&gt;/g,'>').replace(/&quot;/g,'"').replace(/&#39;/g,"'");
  const cab = [...E.cols.map(c=>c.l), 'Observação'];
  const linhas = l.map(r=>[...E.cols.map(c=>txt(c.v(r))), r.obs||'']);
  const csv = [cab,...linhas].map(x=>x.map(v=>`"${String(v??'').replace(/"/g,'""')}"`).join(';')).join('\r\n');
  baixar(`${k}_${(contrato?.nome||'').replace(/[^\w]+/g,'_')}_${est.mes||'todos'}.csv`, '\ufeff'+csv, 'text/csv;charset=utf-8');
}

  e.preventDefault(); const f=e.target;
  if(f.senha.value!==f.senha2.value){ $('#novaSenhaErro').textContent='As senhas não são iguais.'; return; }
  const { error } = await sb.auth.updateUser({ password:f.senha.value });
  if(error){ $('#novaSenhaErro').textContent=error.message; return; }
  history.replaceState(null,'',location.pathname); f.reset();
  entrarNoSistema((await sb.auth.getSession()).data.session);
});

/* ===================== INÍCIO ===================== */
sb.auth.onAuthStateChange((evento, session)=>{
  setTimeout(()=>{
    if(evento==='PASSWORD_RECOVERY' || (session && PRECISA_SENHA)){ PRECISA_SENHA = false; mostrarLogin('senha'); return; }
    if(!telaLogin.hidden && !$('#fNovaSenha').hidden) return; // aguardando a pessoa criar a senha
    if(session) entrarNoSistema(session); else mostrarLogin('login');
  },0);
});
</script>
